const CATEGORIES = ['Senior', 'Junior', 'Youth'];
const DISCIPLINES = ['Piste', 'Route'];

function getSprintFrequency(c, d) { return (c === 'Youth' && d === 'Piste') ? 2 : 1; }
function getOfficialDistance(c, d) { if (c === 'Youth') return 5000; return d === 'Piste' ? 5000 : 10000; }
function computeNeutralizedLaps(circ) { let n = 1; while (n * circ < 999) n++; return n; }
function buildRaceConfig({ category, discipline, totalDistance, circuitLength }) {
  const totalLaps = Math.round(totalDistance / circuitLength);
  const neutralizedLaps = computeNeutralizedLaps(circuitLength);
  const pointedLaps = totalLaps - neutralizedLaps;
  const frequency = getSprintFrequency(category, discipline);
  const sprints = [];
  const step = frequency === 1 ? 1 : 2;
  for (let i = pointedLaps; i >= (frequency === 1 ? 1 : 2); i -= step)
    sprints.push({ id: sprints.length + 1, label: `${i}`, lapsRemaining: i, isFinal: false });
  sprints.push({ id: sprints.length + 1, label: 'ARRIVÉE', lapsRemaining: 0, isFinal: true });
  const firstSprintDistance = neutralizedLaps * circuitLength;
  const warnings = [];
  if (firstSprintDistance > 1300) warnings.push(`1er point à ${firstSprintDistance} m — vérifier le circuit.`);
  return { category, discipline, totalDistance, circuitLength, totalLaps, neutralizedLaps, pointedLaps, frequency, sprints, firstSprintDistance, warnings };
}
function pointsForPosition(pos, isFinal) {
  if (isFinal) return pos === 1 ? 3 : pos === 2 ? 2 : pos === 3 ? 1 : 0;
  return pos === 1 ? 2 : pos === 2 ? 1 : 0;
}
function computeRanking(skaters, sprintResults, lapChanges) {
  const data = skaters.map(s => ({ ...s, laps: lapChanges[s.id] || 0, points: 0, lastSprintPosition: null, finishPosition: null, lappedOut: (lapChanges[s.id] || 0) < 0, statusVoid: s.status === 'DNF' || s.status === 'DSQ' }));
  [...sprintResults].sort((a, b) => a.sprintId - b.sprintId).forEach(sp => {
    sp.positions.forEach((sid, idx) => {
      const sk = data.find(d => d.id === sid); if (!sk) return;
      sk.points += pointsForPosition(idx + 1, sp.isFinal);
      sk.lastSprintPosition = idx + 1;
      if (sp.isFinal) sk.finishPosition = idx + 1;
    });
  });
  data.forEach(d => { if (d.lappedOut || d.statusVoid) d.points = 0; });
  data.sort((a, b) => {
    if (a.statusVoid && !b.statusVoid) return 1;
    if (!a.statusVoid && b.statusVoid) return -1;
    if (b.laps !== a.laps) return b.laps - a.laps;
    if (b.points !== a.points) return b.points - a.points;
    // À égalité de points : le classement à l'ARRIVÉE prime.
    const aF = a.finishPosition ?? 9999, bF = b.finishPosition ?? 9999;
    if (aF !== bF) return aF - bF;
    // Cas où aucun des deux n'a marqué/figuré à l'arrivée : on retombe sur le dernier point pris.
    const aL = a.lastSprintPosition ?? 9999, bL = b.lastSprintPosition ?? 9999;
    return aL - bL;
  });
  return data.map((d, i) => ({ ...d, rank: i + 1 }));
}
function computeTeamRanking(ranking) {
  const t = {};
  ranking.forEach(r => { const c = r.club || '—'; if (!t[c]) t[c] = { club: c, points: 0, skaters: [], bestRank: 9999 }; t[c].points += r.points; t[c].skaters.push(r); t[c].bestRank = Math.min(t[c].bestRank, r.rank); });
  return Object.values(t).filter(x => x.skaters.length).sort((a, b) => b.points - a.points || a.bestRank - b.bestRank);
}

function normalize(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');}
function scoreMatch(s,nq){const n=normalize(s.name),c=normalize(s.club);if(n.startsWith(nq))return 100;if(n.includes(nq))return 50;if(c.startsWith(nq))return 25;if(c.includes(nq))return 10;return 0;}
function searchSkaters(skaters,q){
  if(!q)return skaters;const t=q.trim();
  if(/^\d+$/.test(t)){const ex=skaters.find(s=>String(s.bib)===t);if(ex)return[ex,...skaters.filter(s=>s!==ex&&String(s.bib).startsWith(t))];return skaters.filter(s=>String(s.bib).startsWith(t));}
  const nq=normalize(t);return skaters.map(s=>({s,sc:scoreMatch(s,nq)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).map(x=>x.s);
}

// Identité athlète = nom normalisé (international). Profils futurs = même clé.
function nameKey(s){return normalize(s.name);}
function getRole(roles,s){return roles[nameKey(s)]||null;}
const ROLE_ICON={mine:'⭐',primary:'🔴',secondary:'🟠'};
const ROLE_LABEL={mine:'Mes coureurs',primary:'Adversaires principaux',secondary:'Adversaires secondaires'};

function orderedCandidates(skaters, roles, pointsById, rankById, query, excludeIds){
  const avail=skaters.filter(s=>!excludeIds.includes(s.id));
  if(query)return searchSkaters(avail,query);
  // 1) tous les marqueurs (pts>0) triés par classement provisoire réel — quel que soit le rôle
  const scorers=avail.filter(s=>(pointsById[s.id]||0)>0).sort((a,b)=>((rankById[a.id]||9999)-(rankById[b.id]||9999))||((pointsById[b.id]||0)-(pointsById[a.id]||0)));
  // 2) puis les non-marqueurs, groupés par rôle
  const rest=avail.filter(s=>!((pointsById[s.id]||0)>0));
  const tM=[],tP=[],tS=[],tO=[];
  rest.forEach(s=>{const r=getRole(roles,s);if(r==='mine')tM.push(s);else if(r==='primary')tP.push(s);else if(r==='secondary')tS.push(s);else tO.push(s);});
  const byBib=(a,b)=>a.bib-b.bib;
  tM.sort(byBib);tP.sort(byBib);tS.sort(byBib);tO.sort(byBib);
  return [...scorers,...tM,...tP,...tS,...tO];
}

// Mémoire canonique : convertit le live (points/tours/statuts) en log d'événements typés.
function buildEventLog(roster, race){
  const st=buildRaceConfig(race.config||defaultPointsConfig());
  const spById={};st.sprints.forEach(sp=>spById[sp.id]=sp);
  const byId={};roster.forEach(s=>byId[s.id]=s);
  const k=(id)=>byId[id]?nameKey(byId[id]):null;
  const log=[];let seq=1;
  [...(race.live?.sprintResults||[])].sort((a,b)=>a.sprintId-b.sprintId).forEach(sp=>{
    const meta=spById[sp.sprintId]||{};const isFinal=!!meta.isFinal;
    log.push({id:`pt-${sp.sprintId}`,seq:seq++,type:isFinal?'ARRIVEE':'POINT',source:'live',videoTime:null,
      point:meta.label||String(sp.sprintId),
      positions:sp.positions.map((id,idx)=>({rank:idx+1,athleteKey:k(id),bib:(byId[id]||{}).bib,name:(byId[id]||{}).name,pts:pointsForPosition(idx+1,isFinal)}))});
  });
  Object.entries(race.live?.lapChanges||{}).forEach(([id,v])=>{if(!v)return;const s=byId[id];if(!s)return;log.push({id:`lap-${id}`,seq:seq++,type:v>0?'LAP_GAIN':'LAP_LOSS',source:'live',videoTime:null,athleteKey:nameKey(s),bib:s.bib,name:s.name,value:v});});
  roster.forEach(s=>{if(s.status){log.push({id:`st-${s.id}`,seq:seq++,type:s.status,source:'live',videoTime:null,athleteKey:nameKey(s),bib:s.bib,name:s.name});}});
  // événements tactiques déjà présents (séquenceur futur) : on les conserve
  (race.log||[]).filter(e=>e.source&&e.source!=='live').forEach(e=>log.push({...e,seq:seq++}));
  return log;
}
// Base athlètes dérivée (union des rosters par clé nom).
function buildAthleteBase(events){
  const base={};
  events.forEach(ev=>(ev.roster||[]).forEach(s=>{
    const key=nameKey(s);if(!key)return;
    if(!base[key])base[key]={key,name:s.name,nat:s.nat||'FRA',clubs:[]};
    base[key].nat=s.nat||base[key].nat;
    if(s.club&&!base[key].clubs.includes(s.club))base[key].clubs.push(s.club);
  }));
  return base;
}

// Vue dérivée des points live, liés au tour (structurel) et au temps vidéo (depuis race.laps).
// Résout les points effectifs en fusionnant les sources : live > correction > vidéo.
function resolvePoints(roster, race, structure){
  const byId={};roster.forEach(s=>byId[s.id]=s);
  const byKey={};roster.forEach(s=>{byKey[nameKey(s)]=s;});
  const corr={},vid={};
  (race.log||[]).forEach(e=>{if(e.type==='POINT_CORRECTION')corr[e.sprintId]=e;else if(e.type==='POINT'&&e.source==='sequencer')vid[e.sprintId]=e;});
  const mapKeyPos=(arr,isFinal)=>(arr||[]).map((p,idx)=>{const sk=byKey[p.athleteKey]||{};return {rank:p.rank||idx+1,athleteKey:p.athleteKey,id:sk.id,bib:sk.bib,name:sk.name,value:pointsForPosition(p.rank||idx+1,isFinal)};});
  const out={};
  structure.sprints.forEach(sp=>{
    const liveRes=(race.live?.sprintResults||[]).find(r=>r.sprintId===sp.id);
    const livePos=liveRes?liveRes.positions.map((id,idx)=>({rank:idx+1,id,athleteKey:byId[id]?nameKey(byId[id]):null,bib:(byId[id]||{}).bib,name:(byId[id]||{}).name,value:pointsForPosition(idx+1,sp.isFinal)})):null;
    let positions=null,provenance=null,isCorrection=false,original=null;
    if(corr[sp.id]){positions=mapKeyPos(corr[sp.id].positions,sp.isFinal);provenance='sequencer';isCorrection=true;original=livePos;}
    else if(livePos){positions=livePos;provenance='live';}
    else if(vid[sp.id]){positions=mapKeyPos(vid[sp.id].positions,sp.isFinal);provenance='sequencer';}
    if(positions&&positions.length)out[sp.id]={positions,provenance,isCorrection,original};
  });
  return out;
}
// Pour computeRanking : positions (ids) par sprint, sources fusionnées.
function effectiveSprintResults(roster, race, structure){
  const resolved=resolvePoints(roster,race,structure);
  return structure.sprints.filter(sp=>resolved[sp.id]).map(sp=>({sprintId:sp.id,isFinal:!!sp.isFinal,positions:resolved[sp.id].positions.map(p=>p.id).filter(x=>x!=null)}));
}
function effectiveMode(race){return (race.origin&&race.origin!=='auto')?race.origin:((race.live?.sprintResults||[]).length?'live':'video');}

// Vue dérivée des points (export + lecture) : fusion + tour + vidéo + contexte par attribution.
function buildPoints(roster, race, structure){
  const resolved=resolvePoints(roster,race,structure);
  const cumByLap={},lapTimeByLap={};(race.laps||[]).forEach(l=>{cumByLap[l.lap]=l.cumTime;lapTimeByLap[l.lap]=l.lapTime;});
  const ctx={};(race.log||[]).filter(e=>e.type==='POINT_CONTEXT'&&e.ref).forEach(e=>{ctx[e.ref.sprintId+'|'+e.ref.athleteKey]=e.tags||{};});
  const neutralized=structure.neutralizedLaps,freq=structure.frequency;
  const pts=[];
  structure.sprints.forEach((sp,index)=>{
    const r=resolved[sp.id];if(!r)return;
    const lap=neutralized+index*freq;
    pts.push({sprintId:sp.id,label:sp.label,index,isFinal:!!sp.isFinal,lap,
      videoTime:cumByLap[lap]!=null?cumByLap[lap]:null,lapTime:lapTimeByLap[lap]!=null?lapTimeByLap[lap]:null,
      provenance:r.provenance,isCorrection:r.isCorrection,original:r.original,
      positions:r.positions.map(p=>({...p,context:p.athleteKey?(ctx[sp.id+'|'+p.athleteKey]||null):null}))});
  });
  return pts;
}

// extractFeatures(log, athleteKey, pointOrder)
// Moteur de features tactiques. Fonctionne sur un log COMPLET ou PARTIEL
// (donc utilisable hors-ligne pour les profils ET en live pour l'assistant).
// Cette version exploite les features LIBRES (dérivées du log de points) :
//   F1 = phase de marquage · F5 = état virtuel (rang/écart au moment des points) · F8 = arrivée.
// Les emplacements TAG (F2,F3,F4,F6,F7) sont réservés pour le futur séquenceur.
// pointOrder = [{label, isFinal}] dans l'ordre de course (depuis structure.sprints).
// ============================================================
function extractFeatures(log, athleteKey, pointOrder){
  const scoring=(log||[]).filter(e=>e.type==='POINT'||e.type==='ARRIVEE').slice().sort((a,b)=>(a.seq||0)-(b.seq||0));
  if(!scoring.length)return null;
  // mapping phase par libellé de point
  const nonFinal=(pointOrder||[]).filter(p=>!p.isFinal);
  const nf=nonFinal.length||1;
  const phaseOfLabel={};
  nonFinal.forEach((p,i)=>{phaseOfLabel[p.label]= i<nf/3?'debut': i<2*nf/3?'milieu':'fin';});
  const phaseOfEvent=(e)=> (e.type==='ARRIVEE')?'arrivee':(phaseOfLabel[e.point]||'milieu');

  const cum={};let total=0;
  const moments=[];const phasePts={debut:0,milieu:0,fin:0,arrivee:0};
  let finish={scored:false,rank:null,pts:0};
  scoring.forEach(e=>{
    (e.positions||[]).forEach(p=>{if(p.athleteKey)cum[p.athleteKey]=(cum[p.athleteKey]||0)+(p.pts||0);});
    const mine=(e.positions||[]).find(p=>p.athleteKey===athleteKey);
    if(mine){
      const pts=mine.pts||0;total+=pts;
      const ph=phaseOfEvent(e);phasePts[ph]+=pts;
      const sorted=Object.entries(cum).sort((a,b)=>b[1]-a[1]);
      const rank=sorted.findIndex(([k])=>k===athleteKey)+1;
      const leaderPts=sorted.length?sorted[0][1]:0;
      const gap=leaderPts-(cum[athleteKey]||0);
      moments.push({phase:ph,pts,rank,gap});
      if(e.type==='ARRIVEE')finish={scored:true,rank:mine.rank,pts};
    }
  });
  if(total===0)return null;
  const share=(x)=>+(x/total).toFixed(3);
  const F1={debut:share(phasePts.debut),milieu:share(phasePts.milieu),fin:share(phasePts.fin),arrivee:share(phasePts.arrivee)};
  const avg=(f)=>moments.length?+(moments.reduce((s,m)=>s+f(m),0)/moments.length).toFixed(2):null;
  const leading=moments.filter(m=>m.rank===1||m.gap<=0).length;
  const F5={
    avgRank:avg(m=>m.rank),
    avgGap:avg(m=>m.gap),
    scoredLeadingShare:moments.length?+(leading/moments.length).toFixed(2):0,
    phaseTypique:Object.entries(F1).sort((a,b)=>b[1]-a[1])[0][0]
  };
  const labels=[];
  if(F1.debut>=0.45)labels.push('scoreur_precoce');

}

function mergeRosters(batches){

// PARSEUR LOCAL GÉNÉRIQUE (sans IA) — FFRS, Europe, World Skate, OCR, copier-coller.
// Stratégie : colonnes d'abord (tab / 2+ espaces), sinon mode "loose".
const COUNTRY_NAMES={france:'FRA',espagne:'ESP',spain:'ESP',espana:'ESP',italie:'ITA',italy:'ITA',italia:'ITA',allemagne:'GER',germany:'GER',deutschland:'GER',belgique:'BEL',belgium:'BEL',belgie:'BEL',paysbas:'NED',netherlands:'NED',nederland:'NED',portugal:'POR',suisse:'SUI',switzerland:'SUI',schweiz:'SUI',colombie:'COL',colombia:'COL',bresil:'BRA',brazil:'BRA',brasil:'BRA',coree:'KOR',korea:'KOR',japon:'JPN',japan:'JPN',chine:'CHN',china:'CHN',taiwan:'TPE',taipei:'TPE',usa:'USA',etatsunis:'USA',argentine:'ARG',argentina:'ARG',mexique:'MEX',mexico:'MEX',chili:'CHI',chile:'CHI',equateur:'ECU',ecuador:'ECU',venezuela:'VEN',australie:'AUS',australia:'AUS',pologne:'POL',poland:'POL',danemark:'DEN',denmark:'DEN'};
// Codes pays ISO/IOC 3 lettres (large, international) — pour isoler la nationalité.
const NAT_CODES=new Set(('FRA ESP ITA GER BEL NED POR SUI GBR IRL USA CAN MEX COL CHI ARG BRA ECU VEN PER PAR URU BOL GUA CRC ESA HON NCA PAN DOM PUR CUB KOR PRK JPN CHN TPE HKG SGP MAS THA INA IND PHI VIE AUS NZL CZE SVK POL AUT HUN SLO CRO SRB DEN SWE NOR FIN EST LAT LTU RUS UKR BLR TUR GRE ROU BUL ISR KAZ RSA NAM EGY MAR ALG TUN ANG KEN COD CIV').split(/\s+/));
const isNat=(t)=>{const u=(t||'').toUpperCase();return /^[A-Z]{3}$/.test(u)&&NAT_CODES.has(u);};
const CAT_PREFIX=/\b((SE|JU|VE|CA|MI|BE|PO|DA)[HFG])\b/i;
const CAT_WORD=/\b(seniors?|sen|juniors?|jun|cadets?|minimes?|espoirs?|veterans?|vet|masters?|youth|u1[0-9]|u2[0-9])\b/i;
function catNorm(w){w=(w||'').toLowerCase();if(/^(se|sen|senior)/.test(w))return 'Senior';if(/^(ju|jun|junior)/.test(w))return 'Junior';if(/^(ve|vet|master)/.test(w))return 'Veteran';if(/(cadet|minime|youth|^ca|^mi|^be|^po|u1|u2|espoir)/.test(w))return 'Youth';return 'Senior';}
function parseLocalRoster(text){
  const NATS=Object.keys(FLAG_MAP);
  const out=[];
  text.split(/\r?\n/).forEach(line=>{
    let raw=(line||'').replace(/\u00a0/g,' ').replace(/\t/g,'  ').trim();
    if(!raw)return;
    if(!/\d/.test(raw)&&/\b(dos|lic|nom|pr[eé]nom|club|ligue|ordre|name|bib|team|country|pays|nat|rank|pos|temps|time)\b/i.test(raw))return;
    const bibM=raw.match(/(?:^|\D)(\d{1,4})(?:\D|$)/);
    if(!bibM)return;
    const bib=Number(bibM[1]);
    let nat='FRA',cat='Senior';
    const grabNat=(tok)=>{const u=tok.toUpperCase();const fl=tok.toLowerCase().replace(/[^a-z]/g,'');if(isNat(u)){nat=u;return true;}if(COUNTRY_NAMES[fl]){nat=COUNTRY_NAMES[fl];return true;}return false;};

    let fields=raw.split(/ {2,}/).map(f=>f.trim()).filter(Boolean);
    if(fields.length>=3){
      // ---- mode COLONNES (exports propres, toutes fédérations) ----
      let usedBib=false;
      let fs=fields.filter(f=>{
        if(!usedBib&&/^\d{1,4}$/.test(f)&&Number(f)===bib){usedBib=true;return false;}
        if(/^\d{5,}$/.test(f))return false;          // licence
        if(/^\d{1,3}$/.test(f))return false;         // rang / ordre
        if(/^\d{2}-\d{2}$/.test(f))return false;     // ligue
        if(/^\d+[:.]\d/.test(f))return false;        // temps
        if(f.split(/\s+/).length===1&&grabNat(f))return false; // nationalité seule
        if(f.split(/\s+/).length===1&&CAT_WORD.test(f)){cat=catNorm(f);return false;}
        return true;
      }).map(f=>{const m=f.match(CAT_PREFIX);if(m){cat=catNorm(m[1]);return f.replace(CAT_PREFIX,'').replace(/^[-\s]+/,'').trim();}return f;}).filter(Boolean);
      let name='',club='';
      if(fs.length===0){name=`Coureur ${bib}`;}
      else if(fs.length===1){name=fs[0];}
      else if(fs.length===2){name=fs[0];club=fs[1];}
      else{let li=0,lmax=0;fs.forEach((f,i)=>{if(f.length>lmax){lmax=f.length;li=i;}});club=fs[li];name=fs.filter((_,i)=>i!==li).join(' ');}
      out.push({bib,name:name||`Coureur ${bib}`,club:club.trim(),nat,cat});
    }else{
      // ---- mode LOOSE (OCR sale, espaces simples) ----
      let rest=raw.replace(bibM[0],' ').replace(/\b\d{5,}\b/g,' ').replace(/\b\d{2}-\d{2}\b/g,' ').replace(/\b\d+[:.]\d+\b/g,' ').replace(/\s{2,}/g,' ').trim();
      let toks=rest.split(/\s+/).filter(Boolean);
      let name='',club='';
      // 1) code pays ISO 3 lettres = séparateur nom / club (gère les noms composés)
      const natIdx=toks.findIndex(t=>isNat(t));
      if(natIdx>=0){
        nat=toks[natIdx].toUpperCase();
        name=toks.slice(0,natIdx).join(' ').trim();
        club=toks.slice(natIdx+1).join(' ').trim();
      }else{
        // 2) nom de pays en toutes lettres comme séparateur
        let cnIdx=-1,cnCode=null;
        for(let i=0;i<toks.length;i++){const fl=toks[i].toLowerCase().replace(/[^a-z]/g,'');if(COUNTRY_NAMES[fl]){cnIdx=i;cnCode=COUNTRY_NAMES[fl];break;}}
        if(cnIdx>=0){nat=cnCode;name=toks.slice(0,cnIdx).join(' ').trim();club=toks.slice(cnIdx+1).join(' ').trim();}
        else{
          // 3) préfixe catégorie FFRS (SEH/JUH/VEH…) = début du club
          const cm=rest.match(CAT_PREFIX);
          if(cm){cat=catNorm(cm[1]);name=rest.slice(0,cm.index).trim();club=rest.slice(cm.index+cm[1].length).replace(/^[-\s]+/,'').trim();}
          else{
            // 4) défaut : nom = 2 premiers tokens, club = reste
            let r2=rest.replace(/\s+\d{1,3}\s*$/,'').replace(/\s{2,}/g,' ').trim();const t2=r2.split(/\s+/).filter(Boolean);
            if(t2.length<=2)name=t2.join(' ');else{name=t2.slice(0,2).join(' ');club=t2.slice(2).join(' ');}
          }
        }
      }
      // catégorie éventuelle dans le club / nettoyage ordre final
      const cw=club.match(CAT_PREFIX)||club.match(CAT_WORD);
      if(cw){cat=catNorm(cw[1]||cw[0]);club=club.replace(CAT_PREFIX,'').replace(CAT_WORD,'').replace(/^[-\s]+/,'').trim();}
      club=club.replace(/\s+\d{1,3}\s*$/,'').replace(/\s{2,}/g,' ').trim();
      out.push({bib,name:name||`Coureur ${bib}`,club,nat,cat});
    }
  });
  return out;
}

      roster:Array.isArray(e.roster)?e.roster.map((s,i)=>({id:s.id||i+1,bib:Number(s.bib)||0,name:s.name||`Coureur ${s.bib||i+1}`,club:s.club||'',nat:(s.nat||'FRA').toUpperCase(),cat:s.cat||'Senior',status:s.status||null})):[],
      roles:e.roles&&typeof e.roles==='object'?e.roles:{},
      races:(Array.isArray(e.races)&&e.races.length?e.races:[makeRace('points')]).map(r=>({id:r.id||rid(),module:r.module||'points',label:r.label||'Course',config:r.config||defaultPointsConfig(),origin:r.origin||'auto',live:{sprintResults:Array.isArray(r.live?.sprintResults)?r.live.sprintResults:[],lapChanges:r.live?.lapChanges||{}},laps:Array.isArray(r.laps)?r.laps:[],log:Array.isArray(r.log)?r.log:[],video:r.video||null}))
    }));
    setEvents(evs);setActiveEventId(evs[0].id);setActiveRaceId(evs[0].races[0].id);setActiveSprintIdx(0);setLastSprintId(null);
    showToast(`${evs.length} événement(s) importé(s)`,'gain');
  };

  const structure=useMemo(()=>mod.id==='points'?buildRaceConfig(config):{sprints:[]},[mod.id,config]);
  const effSprint=useMemo(()=>mod.id==='points'?effectiveSprintResults(skaters,race,structure):[],[skaters,race,structure,mod.id]); // fusion live+correction+vidéo
  const sprintResults=effSprint; // les vues de lecture utilisent les points effectifs
  const ranking=useMemo(()=>computeRanking(skaters,effSprint,lapChanges),[skaters,effSprint,lapChanges]);
  const prevRanking=useMemo(()=>{if(lastSprintId==null)return null;const w=effSprint.filter(s=>s.sprintId!==lastSprintId);if(w.length===effSprint.length)return null;return computeRanking(skaters,w,lapChanges);},[skaters,effSprint,lapChanges,lastSprintId]);
  const rankingWithMove=useMemo(()=>{if(!prevRanking)return ranking.map(r=>({...r,move:0}));const map={};prevRanking.forEach(p=>{map[p.id]=p.rank;});return ranking.map(r=>({...r,move:map[r.id]!=null?map[r.id]-r.rank:0}));},[ranking,prevRanking]);
  const pointsInfo=useMemo(()=>{const rec=new Set(effSprint.map(s=>s.sprintId));let total=0,maxSolo=0;structure.sprints.forEach(sp=>{if(rec.has(sp.id))return;total+=sp.isFinal?6:3;maxSolo+=sp.isFinal?3:2;});return {total,maxSolo,remaining:structure.sprints.length-effSprint.length};},[structure,effSprint]);
  const teamRanking=useMemo(()=>computeTeamRanking(ranking),[ranking]);
  const pointsById=useMemo(()=>{const m={};ranking.forEach(r=>{m[r.id]=r.points;});return m;},[ranking]);
  const rankById=useMemo(()=>{const m={};ranking.forEach(r=>{m[r.id]=r.rank;});return m;},[ranking]);
  const activeSprint=structure.sprints[activeSprintIdx];
  const roleCounts=useMemo(()=>{const c={mine:0,primary:0,secondary:0};Object.values(roles).forEach(r=>{if(c[r]!=null)c[r]++;});return c;},[roles]);

  return (
    <div className="flex flex-col h-full bg-zinc-950 no-tap">
      <header className="safe-top bg-black border-b border-zinc-800 px-3 pt-2 pb-2 flex items-center gap-2 shrink-0">
        <button onClick={()=>setShowSwitcher(true)} className="flex-1 min-w-0 text-left">
          <div className="text-[9px] tracking-[0.25em] text-red-500 uppercase truncate">{event.name}</div>
          <div className="text-sm font-bold leading-none truncate flex items-center gap-1">{mod.icon} {race.label} <span className="text-zinc-600 text-xs">▾</span></div>
        </button>
        <div className="text-right shrink-0">
          <div className="text-[10px] text-zinc-500 uppercase">{config.category} · {config.discipline}</div>
          <div className="text-xs text-zinc-300">{sprintResults.length}/{structure.sprints.length} pts</div>
        </div>
      </header>

      <main className="flex-1 overflow-y-auto">
        {tab==='event' && <EventScreen {...{event,updateEventMeta,race,mod,addRace,selectRace,renameRace,deleteRace,duplicateRace,config,onCat,onDisc,setCircuitLength,setTotalDistance,resetRace,structure,createEvent,events,selectEvent,deleteEvent,duplicateEvent,exportAll,importAll,onOpenSequenceur:()=>setShowSequenceur(true)}} />}
        {tab==='coureurs' && <CoureursScreen {...{skaters,roles,assignRole,assignRoleClub,setShowImport,roleCounts}} />}
        {tab==='saisie' && (mod.operational
          ? <PointsInput {...{structure,activeSprint,activeSprintIdx,setActiveSprintIdx,skaters,roles,sprintResults:liveSprint,updateSprint,lapChanges,setLap,setStatus,pointsInfo,pointsById,rankById}} />
          : <ModuleSoon mod={mod} />)}
        {tab==='classement' && (mod.operational
          ? <PointsBoard {...{ranking:rankingWithMove,teamRanking,roles,pointsInfo}} />
          : <ModuleSoon mod={mod} />)}
        {tab==='analyse' && (mod.operational
          ? <AnalyseScreen {...{skaters,sprintResults,structure,roles,ranking}} />
          : <ModuleSoon mod={mod} />)}
      </main>

      {toast && (
        <div className={`fixed left-1/2 -translate-x-1/2 z-40 px-4 py-2.5 border-2 text-sm font-bold uppercase tracking-wider flex items-center gap-2 ${toast.type==='gain'?'bg-emerald-950 border-emerald-500 text-emerald-300':'bg-red-950 border-red-500 text-red-300'}`} style={{bottom:'calc(env(safe-area-inset-bottom) + 72px)',maxWidth:'92vw'}}>
          <span className="text-lg">{toast.type==='gain'?'▲':'▼'}</span><span className="truncate">{toast.msg}</span>
        </div>
      )}

      <nav className="safe-bottom bg-black border-t border-zinc-800 grid grid-cols-5 shrink-0">
        {[{id:'event',label:'ÉVÉN.',icon:'📅'},{id:'coureurs',label:'COUR.',icon:'👥'},{id:'saisie',label:'SAISIE',icon:'⏱'},{id:'classement',label:'CLASST',icon:'🏆'},{id:'analyse',label:'DÉBRIEF',icon:'📋'}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} className={`py-3 flex flex-col items-center gap-0.5 ${tab===t.id?'text-red-500':'text-zinc-500'}`}>
            <span className="text-base leading-none">{t.icon}</span><span className="text-[8px] tracking-wider">{t.label}</span>
          </button>
        ))}
      </nav>

      {showSwitcher && <Switcher {...{events,event,race,selectEvent,selectRace,createEvent,addRace,onClose:()=>setShowSwitcher(false),setTab}} />}
      {showImport && <ImportModal onClose={()=>setShowImport(false)} onImport={importSkaters} />}
      {showSequenceur && <Sequenceur {...{race,structure,skaters,roles,pointsById,rankById,addLogEvent,deleteLogEvent,addLap,popLap,setRaceOrigin,onClose:()=>setShowSequenceur(false)}} />}
    </div>
  );
}

// Sélecteur rapide événement / course (depuis le header)
function Switcher({events,event,race,selectEvent,selectRace,createEvent,addRace,onClose,setTab}){
  return (
    <div className="fixed inset-0 bg-black/85 z-50 flex items-end justify-center" onClick={onClose}>
      <div className="bg-zinc-950 border border-zinc-700 w-full max-h-[80vh] overflow-y-auto safe-bottom" onClick={e=>e.stopPropagation()}>
        <div className="border-b border-zinc-800 px-4 py-3 flex justify-between items-center sticky top-0 bg-zinc-950"><h2 className="text-sm font-bold uppercase tracking-wider">Événements & courses</h2><button onClick={onClose} className="text-zinc-500 text-xl px-2">✕</button></div>
        <div className="p-3 space-y-3">
          {events.map(ev=>(
            <div key={ev.id} className={`border ${ev.id===event.id?'border-red-600':'border-zinc-800'}`}>
              <button onClick={()=>selectEvent(ev.id)} className="w-full text-left px-3 py-2 flex justify-between items-center">
                <span className="text-sm font-bold truncate">{ev.name}</span><span className="text-[10px] text-zinc-500">{ev.date} · {ev.races.length} course{ev.races.length>1?'s':''}</span>
              </button>
              {ev.id===event.id && (
                <div className="border-t border-zinc-800 p-1 space-y-px">
                  {ev.races.map(r=>{const m=MODULES.find(x=>x.id===r.module)||{};return (
                    <button key={r.id} onClick={()=>{selectRace(r.id);onClose();setTab('saisie');}} className={`w-full flex items-center gap-2 px-2 py-2 text-left text-sm ${r.id===race.id?'bg-red-950/30 text-red-300':'text-zinc-300'}`}>
                      <span>{m.icon}</span><span className="flex-1 truncate">{r.label}</span>{!m.operational&&<span className="text-[9px] text-zinc-600">à venir</span>}
                    </button>);})}
                  <div className="flex flex-wrap gap-1 p-1">
                    {MODULES.map(m=><button key={m.id} onClick={()=>addRace(m.id)} className="px-2 py-1 border border-zinc-800 text-zinc-400 text-[10px]">+ {m.icon} {m.label}</button>)}
                  </div>
                </div>
              )}
            </div>
          ))}
          <button onClick={()=>{createEvent();onClose();}} className="w-full py-2.5 border border-zinc-700 text-zinc-300 text-sm uppercase tracking-wider">+ Nouvel événement</button>
        </div>
      </div>
    </div>
  );
}

function ModuleSoon({mod}){
  return <div className="p-6 text-center text-zinc-500"><div className="text-4xl mb-2">{mod.icon}</div><div className="text-lg font-bold text-zinc-300">{mod.label}</div><div className="text-sm mt-2">Module à venir. L'ossature est prête à l'accueillir : il réutilisera la même base coureurs, les mêmes rôles et le même historique.</div></div>;
}

// ============================================================
// ÉCRAN COURSE (réglages + sauvegarde + historique)
// ============================================================
function EventScreen({event,updateEventMeta,race,mod,addRace,selectRace,renameRace,deleteRace,duplicateRace,config,onCat,onDisc,setCircuitLength,setTotalDistance,resetRace,structure,createEvent,events,selectEvent,deleteEvent,duplicateEvent,exportAll,importAll,onOpenSequenceur}){
  const upd=(k,v)=>updateEventMeta({[k]:v});
  const onImportFile=(e)=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{importAll(JSON.parse(r.result));}catch(err){alert('Fichier illisible: '+err.message);}};r.readAsText(f);e.target.value='';};
  return (
    <div className="p-4 space-y-5">
      <div className="text-[10px] text-emerald-500 flex items-center gap-1"><span>✓</span> Sauvegardé automatiquement sur cet appareil · <span className="text-zinc-500">{APP_VERSION}</span></div>

      <Block title="Événement">
        <Field label="Nom de l'événement"><input value={event.name} onChange={e=>upd('name',e.target.value)} placeholder="ex : Championnats d'Europe 2026" className="w-full bg-black border border-zinc-700 px-3 py-3 text-base outline-none focus:border-red-500" style={{height:'48px'}} /></Field>
        <Field label="📍 Lieu"><input value={event.location||''} onChange={e=>upd('location',e.target.value)} placeholder="ex : Geisingen" className="w-full bg-black border border-zinc-700 px-3 py-3 text-base outline-none focus:border-red-500" style={{height:'48px'}} /></Field>
        <Field label="📅 Date"><input type="date" value={event.date} onChange={e=>upd('date',e.target.value)} className="w-full bg-black border border-zinc-700 px-3 py-3 text-base outline-none focus:border-red-500" style={{height:'48px',WebkitAppearance:'none',appearance:'none',textAlign:'left'}} /></Field>
      </Block>

      <Block title="Transfert / Archivage des données">
        <div className="grid grid-cols-2 gap-2">
          <button onClick={exportAll} className="py-3 border border-emerald-700 bg-emerald-950/20 text-emerald-300 text-sm font-bold uppercase tracking-wider">📤 Exporter</button>
          <label className="py-3 border border-zinc-700 text-zinc-300 text-sm font-bold uppercase tracking-wider text-center cursor-pointer flex items-center justify-center">
            📥 Importer
            <input type="file" accept="application/json,.json" onChange={onImportFile} className="hidden" />
          </label>
        </div>
        <div className="text-[10px] text-zinc-500">Archive complète au format JSON : tous les événements, courses, coureurs, rôles, points et chronologie. Sert à changer d'appareil, partager avec un coach, archiver une saison et alimenter l'analyse. <span className="text-zinc-600">≠ l'import de starting list (onglet Coureurs).</span> ⚠️ Importer une archive remplace toutes les données.</div>
      </Block>

      <Block title={`Courses de l'événement · ${event.races.length}`}>
        <div className="space-y-1">
          {event.races.map(r=><RaceRow key={r.id} r={r} active={r.id===race.id} onSelect={()=>selectRace(r.id)} onRename={(l)=>renameRace(r.id,l)} onDuplicate={()=>duplicateRace(r.id)} onDelete={()=>{if(event.races.length>1&&confirm('Supprimer cette course ?'))deleteRace(r.id);}} canDelete={event.races.length>1} />)}
        </div>
        <div className="text-[10px] text-zinc-500 uppercase tracking-wider mt-2 mb-1">Ajouter une course</div>
        <div className="grid grid-cols-2 gap-1">
          {MODULES.map(m=>(
            <button key={m.id} onClick={()=>addRace(m.id)} className={`py-2 text-xs border flex items-center justify-center gap-1 ${m.operational?'border-zinc-700 text-zinc-300':'border-zinc-800 text-zinc-500'}`}>
              <span>{m.icon}</span><span>{m.label}{!m.operational&&' (à venir)'}</span>
            </button>
          ))}
        </div>
      </Block>

      {mod.id==='points' && (
        <Block title={`Réglages · ${race.label}`}>
          <Choice label="Catégorie" options={CATEGORIES} value={config.category} onChange={onCat} />
          <Choice label="Discipline" options={DISCIPLINES} value={config.discipline} onChange={onDisc} />
          <div className="grid grid-cols-2 gap-2">
            <Field label="Circuit (m)"><input type="number" inputMode="numeric" value={config.circuitLength} onChange={e=>setCircuitLength(Number(e.target.value))} className="w-full bg-black border border-zinc-700 px-2 py-2 text-base outline-none focus:border-red-500" /></Field>
            <Field label="Distance (m)"><input type="number" inputMode="numeric" value={config.totalDistance} onChange={e=>setTotalDistance(Number(e.target.value))} className="w-full bg-black border border-zinc-700 px-2 py-2 text-base outline-none focus:border-red-500" /></Field>
          </div>
          <div className="flex gap-1">{[169,200,250,333,400,500].map(v=><button key={v} onClick={()=>setCircuitLength(v)} className="flex-1 text-xs py-1.5 border border-zinc-800 active:bg-zinc-800 text-zinc-400">{v}</button>)}</div>
          <div className="grid grid-cols-4 gap-x-3 mt-1">
            <Stat label="Tours" value={structure.totalLaps} /><Stat label="Neutr." value={structure.neutralizedLaps} />
            <Stat label="Points" value={structure.sprints.length-1} /><Stat label="Fréq" value={structure.frequency===1?'1/t':'1/2t'} />
          </div>
          {structure.warnings.map((w,i)=><div key={i} className="border-l-2 border-amber-500 bg-amber-950/30 p-2 text-xs text-amber-200">⚠ {w}</div>)}
          <button onClick={()=>{if(confirm('Réinitialiser les résultats de cette course ?'))resetRace();}} className="w-full py-2 border border-zinc-700 text-zinc-500 text-xs uppercase tracking-wider">Réinitialiser les résultats</button>
          <button onClick={onOpenSequenceur} className="w-full py-3 mt-1 border border-zinc-700 bg-zinc-900 text-zinc-200 text-sm font-bold uppercase tracking-wider">🎬 Séquencer cette course</button>
          <div className="text-[10px] text-zinc-600">Analyse tactique post-course (chrono + tags). N'affecte jamais les points ni le classement.</div>
        </Block>
      )}

      <Block title={`Historique · ${events.length} événement${events.length>1?'s':''}`}>
        <div className="space-y-1">
          {events.map(ev=>(
            <div key={ev.id} className={`flex items-center gap-2 p-2 border ${ev.id===event.id?'border-red-600':'border-zinc-800'}`}>
              <button onClick={()=>selectEvent(ev.id)} className="flex-1 min-w-0 text-left">
                <div className="text-sm truncate">{ev.name} {ev.id===event.id&&<span className="text-[9px] text-red-500 uppercase">· actif</span>}</div>
                <div className="text-[10px] text-zinc-500">{ev.date} · {ev.location||'—'} · {ev.races.length} course{ev.races.length>1?'s':''} · {ev.roster.length} coureurs</div>
              </button>
              <button onClick={()=>duplicateEvent(ev.id)} title="Dupliquer" className="px-2 py-1 border border-zinc-700 text-zinc-400 text-xs">⧉</button>
              <button onClick={()=>{if(confirm('Supprimer cet événement et ses courses ?'))deleteEvent(ev.id);}} className="px-2 py-1 border border-zinc-800 text-zinc-600 text-xs">🗑</button>
            </div>
          ))}
        </div>
        <button onClick={createEvent} className="w-full py-2.5 mt-1 border border-zinc-700 text-zinc-300 text-sm uppercase tracking-wider">+ Nouvel événement</button>
      </Block>
      <div className="h-4" />
    </div>
  );
}

function RaceRow({r,active,onSelect,onRename,onDuplicate,onDelete,canDelete}){
  const [edit,setEdit]=useState(false);
  const [val,setVal]=useState(r.label);
  const m=MODULES.find(x=>x.id===r.module)||{};
  return (
    <div className={`flex items-center gap-1.5 p-2 border ${active?'border-red-600 bg-red-950/20':'border-zinc-800'}`}>
      <span className="shrink-0">{m.icon}</span>
      {edit?(
        <input autoFocus value={val} onChange={e=>setVal(e.target.value)} onBlur={()=>{onRename(val||r.label);setEdit(false);}} className="flex-1 bg-black border border-zinc-700 px-2 py-1 text-sm outline-none focus:border-red-500" />
      ):(
        <button onClick={onSelect} className="flex-1 min-w-0 text-left">
          <div className="text-sm truncate">{r.label}</div>
          <div className="text-[10px] text-zinc-500">{m.label}{!m.operational&&' · à venir'}{active?' · active':' · charger'}</div>
        </button>
      )}
      <button onClick={()=>setEdit(e=>!e)} title="Renommer" className="px-1.5 py-1 border border-zinc-700 text-zinc-400 text-xs">✏️</button>
      <button onClick={onDuplicate} title="Dupliquer" className="px-1.5 py-1 border border-zinc-700 text-zinc-400 text-xs">⧉</button>
      {canDelete && <button onClick={onDelete} title="Supprimer" className="px-1.5 py-1 border border-zinc-800 text-zinc-600 text-xs">🗑</button>}
    </div>
  );
}

// ============================================================
// ÉCRAN COUREURS (consolidé : import + roster + rôles)
// Source unique des statuts.
// ============================================================
function CoureursScreen({skaters,roles,assignRole,assignRoleClub,setShowImport,roleCounts}){
  const [q,setQ]=useState('');
  const [filter,setFilter]=useState('all'); // all | mine | rivals | rest
  const [teamOpen,setTeamOpen]=useState(false);

  let list=q?searchSkaters(skaters,q):skaters.slice();
  if(filter==='mine')list=list.filter(s=>getRole(roles,s)==='mine');
  else if(filter==='rivals')list=list.filter(s=>['primary','secondary'].includes(getRole(roles,s)));
  else if(filter==='rest')list=list.filter(s=>!getRole(roles,s));
  if(!q)list.sort((a,b)=>{const o={mine:3,primary:2,secondary:1};return (o[getRole(roles,b)]||0)-(o[getRole(roles,a)]||0)||a.bib-b.bib;});

  const clubs=useMemo(()=>{const m={};skaters.forEach(s=>{const c=s.club||'—';(m[c]=m[c]||[]).push(s);});return Object.entries(m).map(([club,l])=>({club,count:l.length,mineCount:l.filter(s=>getRole(roles,s)==='mine').length})).sort((a,b)=>b.count-a.count||a.club.localeCompare(b.club));},[skaters,roles]);

  return (
    <div className="p-4 space-y-3">
      <button onClick={()=>setShowImport(true)} className="w-full py-2.5 bg-red-600 active:bg-red-500 text-white text-sm font-bold uppercase tracking-wider">↓ Importer une starting list</button>

      <div className="grid grid-cols-3 gap-1 text-center">
        <Counter icon="⭐" label="Mes coureurs" n={roleCounts.mine} />
        <Counter icon="🔴" label="Adv. princ." n={roleCounts.primary} />
        <Counter icon="🟠" label="Adv. second." n={roleCounts.secondary} />
      </div>

      <input value={q} onChange={e=>setQ(e.target.value)} inputMode="numeric" placeholder="Rechercher (dossard / nom)…" className="w-full bg-black border border-zinc-700 px-3 py-2.5 text-base outline-none focus:border-red-500" />

      <div className="flex gap-1">
        {[['all','Tous'],['mine','⭐'],['rivals','🔴🟠'],['rest','Reste']].map(([id,lbl])=>(
          <button key={id} onClick={()=>setFilter(id)} className={`flex-1 py-1.5 text-xs border ${filter===id?'border-red-500 bg-red-500/10 text-red-400':'border-zinc-800 text-zinc-500'}`}>{lbl}</button>
        ))}
      </div>

      <button onClick={()=>setTeamOpen(o=>!o)} className="w-full py-1.5 border border-zinc-800 text-zinc-400 text-[10px] uppercase tracking-wider">{teamOpen?'Masquer':'⭐ Coacher une équipe entière'}</button>
      {teamOpen && (
        <div className="border border-zinc-800 max-h-52 overflow-y-auto">
          {clubs.map(c=>(
            <button key={c.club} onClick={()=>assignRoleClub(c.club,'mine')} className={`w-full flex items-center gap-2 px-2 py-2 border-b border-zinc-900 text-left text-xs ${c.mineCount===c.count?'bg-amber-950/30':''}`}>
              <span className="flex-1 truncate" style={{color:clubColor(c.club)}}>{clubShort(c.club)}</span>
              <span className="text-zinc-600">×{c.count}</span>
              <span className={c.mineCount>0?'text-amber-400':'text-zinc-700'}>{c.mineCount===c.count?'⭐ tous':c.mineCount>0?`⭐ ${c.mineCount}/${c.count}`:'+⭐'}</span>
            </button>
          ))}
        </div>
      )}

      <div className="border border-zinc-800 divide-y divide-zinc-900">
        {list.map(s=>{
          const r=getRole(roles,s);
          return (
            <div key={s.id} className="flex items-center gap-1.5 py-2 px-2">
              <button onClick={()=>assignRole(s,'mine')} className={`text-base ${r==='mine'?'':'opacity-25 grayscale'}`}>⭐</button>
              <button onClick={()=>assignRole(s,'primary')} className={`text-base ${r==='primary'?'':'opacity-25 grayscale'}`}>🔴</button>
              <button onClick={()=>assignRole(s,'secondary')} className={`text-base ${r==='secondary'?'':'opacity-25 grayscale'}`}>🟠</button>
              <span className="font-bold text-red-500 w-9 text-center text-sm">{s.bib}</span>
              <div className="flex-1 min-w-0">
                <div className="text-sm truncate">{s.name}</div>
                <div className="text-[10px] truncate" style={{color:clubColor(s.club)}}>{clubShort(s.club)}</div>
              </div>
              <span className="text-xs">{flag(s.nat)}</span>
            </div>
          );
        })}
        {list.length===0 && <div className="px-2 py-4 text-zinc-600 text-xs text-center">Aucun coureur.</div>}
      </div>
      <div className="h-4" />
    </div>
  );
}

function Lb({on,c,onClick,children}){const cls=on?{red:'border-red-500 bg-red-500/20 text-red-400',emerald:'border-emerald-500 bg-emerald-500/20 text-emerald-400',amber:'border-amber-500 bg-amber-500/20 text-amber-400',zinc:'border-zinc-500 bg-zinc-800 text-zinc-200'}[c]:'border-zinc-800 text-zinc-600';return <button onClick={onClick} className={`px-1.5 py-1 border text-[10px] ${cls}`}>{children}</button>;}

function FastSprintInput({sprint,skaters,roles,pointsById,rankById,existing,onChange,onAdvance}){
  const baseSlots=sprint.isFinal?3:2;
  const ptsFor=(i)=>pointsForPosition(i+1,sprint.isFinal);
  const init=()=>{if(existing){const arr=existing.positions.slice();while(arr.length<baseSlots)arr.push(null);return arr;}return Array(baseSlots).fill(null);};
  const [picks,setPicks]=useState(init);
  const [openSlot,setOpenSlot]=useState(0);
  const [query,setQuery]=useState('');
  useEffect(()=>{const p=init();setPicks(p);const e=p.findIndex(x=>!x);setOpenSlot(e===-1?null:e);setQuery('');},[sprint.id]);
  const excludeIds=picks.filter((p,i)=>p&&i!==openSlot);
  const candidates=useMemo(()=>orderedCandidates(skaters,roles,pointsById,rankById||{},query,excludeIds).slice(0,60),[skaters,roles,pointsById,rankById,query,picks,openSlot]);
  const selectSkater=(id)=>{
    const baseWasComplete=picks.slice(0,baseSlots).every(Boolean);
    const c=[...picks];c[openSlot]=id;setPicks(c);onChange(c);setQuery('');
    const baseNowComplete=c.slice(0,baseSlots).every(Boolean);
    let next=-1;for(let i=0;i<c.length;i++){if(!c[i]){next=i;break;}}
    setOpenSlot(next);
    if(baseNowComplete && !baseWasComplete && !sprint.isFinal)onAdvance();
  };
  const clearSlot=(i)=>{let c;if(i>=baseSlots){c=picks.filter((_,j)=>j!==i);}else{c=[...picks];c[i]=null;}setPicks(c);onChange(c);setQuery('');setOpenSlot(i>=c.length?null:i);};
  const addExtra=()=>{const c=[...picks,null];setPicks(c);setOpenSlot(c.length-1);setQuery('');};
  return (
    <div>
      <div className="space-y-1.5">
        {picks.map((id,i)=>{const sk=skaters.find(s=>s.id===id);const isOpen=i===openSlot;const extra=i>=baseSlots;return (
          <div key={i} onClick={()=>{setOpenSlot(isOpen?null:i);setQuery('');}} className={`flex items-center gap-2 px-2 py-3 border ${isOpen?'border-red-500 bg-red-500/10':sk?(extra?'border-zinc-800 bg-zinc-900/50':'border-zinc-700 bg-zinc-900'):'border-zinc-800'}`}>
            <span className="w-9 text-center shrink-0"><span className="block text-[8px] text-zinc-500 leading-none">P°</span><span className="text-xl font-bold leading-none">{i+1}</span></span>
            {sk?(<span className="flex-1 min-w-0"><span className="flex items-baseline gap-2"><span className="font-bold text-red-500 text-lg">{sk.bib}</span><span className="text-sm truncate">{sk.name}</span></span><span className="text-[10px] truncate block" style={{color:clubColor(sk.club)}}>{clubShort(sk.club)}</span></span>):(<span className="flex-1 text-sm text-zinc-500">{isOpen?'▾ choisis un coureur':extra?'départage (0 pt)':'appuie pour choisir'}</span>)}
            <span className={`font-bold shrink-0 ${ptsFor(i)>0?'text-red-500':'text-zinc-600'}`}>+{ptsFor(i)}</span>
            {sk && <button onClick={(e)=>{e.stopPropagation();clearSlot(i);}} className="text-zinc-500 active:text-red-500 px-2 shrink-0 text-lg">✕</button>}
          </div>);})}
      </div>
      {sprint.isFinal && picks.slice(0,baseSlots).every(Boolean) && (
        <button onClick={addExtra} className="w-full mt-1.5 py-2 border border-zinc-800 text-zinc-500 text-[11px] uppercase tracking-wider">+ Ajouter un finisher (départage, 0 pt)</button>
      )}
      {openSlot!=null && (
        <div className="mt-2 border border-zinc-700 bg-black">
          <div className="p-1.5 border-b border-zinc-800 flex items-center gap-2"><span className="text-[10px] text-zinc-500 uppercase shrink-0">P{openSlot+1} →</span><input value={query} inputMode="numeric" onChange={e=>setQuery(e.target.value)} placeholder="ou tape dossard / nom…" className="flex-1 bg-zinc-900 border border-zinc-800 px-2 py-1.5 text-sm outline-none focus:border-red-500" /></div>
          <div className="max-h-[44vh] overflow-y-auto">
            {candidates.length===0 && <div className="px-2 py-3 text-zinc-600 text-xs">Aucun coureur.</div>}
            {candidates.map(s=>{const p=pointsById[s.id]||0;const rk=rankById?rankById[s.id]:null;const r=getRole(roles,s);const tag=r?ROLE_ICON[r]:(p>0?'📈':'');const bg=r==='mine'?'bg-amber-950/20':r==='primary'?'bg-red-950/20':r==='secondary'?'bg-orange-950/15':'';return (
              <button key={s.id} onClick={()=>selectSkater(s.id)} className={`w-full flex items-center gap-2 px-2 py-2.5 active:bg-zinc-800 border-b border-zinc-900 text-left ${bg}`}>
                <span className="w-5 text-center shrink-0">{tag}</span>
                <span className="font-bold text-red-500 w-9 text-base shrink-0">{s.bib}</span>
                <span className="flex-1 min-w-0"><span className="text-sm truncate block">{s.name}</span><span className="text-[10px] truncate block" style={{color:clubColor(s.club)}}>{clubShort(s.club)}</span></span>
                {rk!=null && <span className="text-[10px] text-zinc-500 shrink-0">{rk}<span className="text-zinc-700">e</span></span>}
                <span className={`text-sm font-bold shrink-0 w-9 text-right ${p>0?'text-zinc-200':'text-zinc-600'}`}>{p}<span className="text-[8px] text-zinc-600 ml-0.5">pt</span></span>
              </button>);})}
          </div>
        </div>
      )}
      <div className="mt-2 text-center text-[10px] text-zinc-600">{sprint.isFinal?'Podium 3-2-1. Ajoute des finishers (0 pt) pour départager les ex æquo.':'P1 + P2 remplis → enregistré + point suivant auto. Flèches ← → pour corriger.'}</div>
    </div>
  );
}

function CompactTimeline({skaters,sprintResults,structure,roles}){
  const byId={};skaters.forEach(s=>byId[s.id]=s);
  const resById={};sprintResults.forEach(r=>resById[r.sprintId]=r);
  const surname=(s)=>s?s.name.split(' ')[0]:'?';
  return (

      {structure.sprints.map(sp=>{const res=resById[sp.id];const isFinal=!!sp.isFinal;const label=isFinal?'ARR':'T'+sp.label;
        if(!res||!res.positions.length)return <div key={sp.id} className="text-[11px] leading-snug"><span className="text-zinc-500 font-bold">{label}</span> <span className="text-zinc-700">: —</span></div>;
        return <div key={sp.id} className="text-[11px] leading-snug">
          <span className={`font-bold ${isFinal?'text-red-500':'text-zinc-400'}`}>{label}</span><span className="text-zinc-600"> : </span>
          {res.positions.map((id,idx)=>{const pts=pointsForPosition(idx+1,isFinal);const s=byId[id];const role=s&&getRole(roles,s);return <span key={idx}>{idx>0?<span className="text-zinc-600"> / </span>:null}{role?ROLE_ICON[role]:''}<span className="text-zinc-200">{surname(s)}</span> <span className="text-red-400">+{pts}</span></span>;})}
        </div>;
      })}
    </div>

function PointsFrise({skaters,sprintResults,structure,roles,ranking}){
  const cols=structure.sprints;
  const ptsMap={};
  sprintResults.forEach(sp=>{const f=!!sp.isFinal;sp.positions.forEach((id,idx)=>{(ptsMap[id]=ptsMap[id]||{})[sp.sprintId]=pointsForPosition(idx+1,f);});});
  const top3=ranking.filter(r=>!r.statusVoid).slice(0,3);
  const coached=ranking.filter(r=>getRole(roles,r)==='mine');
  const seen={},rows=[];[...top3,...coached].forEach(r=>{if(!seen[r.id]){seen[r.id]=1;rows.push(r);}});
  if(!rows.length)return <div className="text-sm text-zinc-500 text-center py-4">—</div>;
  const K=cols.filter(c=>!c.isFinal).length||1;
  const b1=Math.ceil(K/3),b2=Math.ceil(2*K/3);
  const div=(i)=> (i===b1||i===b2||!!cols[i].isFinal);
  const gridCols=`repeat(${cols.length}, 1fr)`;
  return (
    <div style={{fontFamily:'ui-monospace,monospace'}}>
      <div className="grid mb-1 pb-1 border-b border-zinc-800" style={{gridTemplateColumns:gridCols}}>
        {cols.map((c,i)=><div key={c.id} className={`text-center text-[8px] leading-none ${c.isFinal?'text-red-500 font-bold':'text-zinc-500'} ${div(i)?'border-l border-zinc-800':''}`}>{c.isFinal?'AR':c.label}</div>)}
      </div>
      {rows.map(r=>(
        <div key={r.id} className="mb-2">
          <div className="text-[11px] flex items-center gap-1 truncate">{getRole(roles,r)&&<span>{ROLE_ICON[getRole(roles,r)]}</span>}<span className="font-bold text-red-500">{r.bib}</span><span className="truncate">{r.name}</span><span className="text-zinc-500 shrink-0">· {r.points} pts</span></div>
          <div className="grid" style={{gridTemplateColumns:gridCols}}>
            {cols.map((c,i)=>{const p=(ptsMap[r.id]||{})[c.id];return <div key={c.id} className={`text-center text-[11px] leading-tight ${div(i)?'border-l border-zinc-800':''} ${p?(c.isFinal?'text-red-400 font-bold':'text-zinc-100 font-bold'):'text-zinc-700'}`}>{p||'·'}</div>;})}
          </div>
        </div>
      ))}
      <div className="text-[9px] text-zinc-600 mt-1">Top 3 + tes ⭐ · tiers début | milieu | fin · valeur = points pris (AR = arrivée 3/2/1).</div>
    </div>
  );
}

function Sequenceur({race,structure,skaters,roles,pointsById,rankById,addLogEvent,deleteLogEvent,addLap,popLap,setRaceOrigin,onClose}){

  const [elapsed,setElapsed]=useState(0);
  const startRef=useRef(0);const [,setTick]=useState(0);
  useEffect(()=>{if(!running)return;startRef.current=Date.now()-elapsed*1000;const id=setInterval(()=>setTick(t=>t+1),200);return ()=>clearInterval(id);},[running]);
  const cur=()=>running?(Date.now()-startRef.current)/1000:elapsed;
  const fmt=(s)=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
  const laps=race.laps||[];const curLap=laps.length+1;
  const tour=()=>{const c=cur();const prev=laps.length?laps[laps.length-1].cumTime:0;addLap({lap:laps.length+1,lapTime:Math.round((c-prev)*10)/10,cumTime:Math.round(c*10)/10});};

  const mode=effectiveMode(race); // 'live' | 'video'
  const points=useMemo(()=>buildPoints(skaters,race,structure),[skaters,race,structure]);
  const ctxKey=(sid,k)=>sid+'|'+k;
  const ctxMap={};(race.log||[]).filter(e=>e.type==='POINT_CONTEXT'&&e.ref).forEach(e=>{ctxMap[ctxKey(e.ref.sprintId,e.ref.athleteKey)]=e;});
  const lapToLabel={};structure.sprints.forEach((sp,index)=>{lapToLabel[structure.neutralizedLaps+index*structure.frequency]=sp.isFinal?'ARR':'P'+sp.label;});

  const [m,setM]=useState('home'); // home | move | enrich | pointentry
  const [showLaps,setShowLaps]=useState(false);
  const [moveId,setMoveId]=useState(null);const [frozen,setFrozen]=useState({videoTime:0,lap:0});
  const [actor,setActor]=useState(null);const [target,setTarget]=useState(null);const [pick,setPick]=useState(null);
  const [outcome,setOutcome]=useState(null);const [mcost,setMcost]=useState(null);const [note,setNote]=useState('');
  const [enrich,setEnrich]=useState(null);const [etags,setEtags]=useState({});
  const [pe,setPe]=useState(null); // {intent:'creation'|'correction', sprintId, isFinal, label, slots:[athlete|null]}
  const reset=()=>{setM('home');setMoveId(null);setActor(null);setTarget(null);setPick(null);setOutcome(null);setMcost(null);setNote('');setEnrich(null);setEtags({});setPe(null);};
  const needsTarget=(id)=>(SEQ_MOVES.find(x=>x[0]===id)||[])[2];

  const startMove=(id)=>{setFrozen({videoTime:cur(),lap:curLap});setMoveId(id);setActor(null);setTarget(null);setOutcome(null);setMcost(null);setNote('');setPick('actor');setM('move');};
  const saveMove=()=>{if(!actor){setPick('actor');return;}addLogEvent({id:rid(),seq:Date.now(),source:'sequencer',type:'MOVE',move:moveId,actorKey:nameKey(actor),actorBib:actor.bib,targetKey:target?nameKey(target):null,targetBib:target?target.bib:null,outcome,videoTime:Math.round(frozen.videoTime*10)/10,lap:frozen.lap,cost:mcost?Number(mcost):null,note:note.trim()});reset();};
  const incident=(type)=>{setFrozen({videoTime:cur(),lap:curLap});setMoveId(type);setActor(null);setNote('');setPick(type==='CHUTE'?'actor':null);setM('move');};

  const startEnrich=(p,pos)=>{const ex=ctxMap[ctxKey(p.sprintId,pos.athleteKey)];setEnrich({sprintId:p.sprintId,athleteKey:pos.athleteKey,label:p.label,isFinal:p.isFinal,bib:pos.bib,name:pos.name,value:pos.value,lap:p.lap});setEtags(ex?{...ex.tags}:{});setM('enrich');};
  const saveEnrich=()=>{if(!enrich)return;const ex=ctxMap[ctxKey(enrich.sprintId,enrich.athleteKey)];if(ex)deleteLogEvent(ex.id);addLogEvent({id:rid(),seq:Date.now(),source:'sequencer',type:'POINT_CONTEXT',ref:{sprintId:enrich.sprintId,athleteKey:enrich.athleteKey},videoTime:Math.round(cur()*10)/10,lap:enrich.lap,tags:{...etags}});reset();};

  const startPointEntry=(intent,sp)=>{const slots=Array((sp&&sp.isFinal)?3:2).fill(null);setPe({intent,sprintId:sp?sp.id:null,isFinal:sp?!!sp.isFinal:false,label:sp?sp.label:'',slots});setPick(null);setM('pointentry');};
  const peChooseSprint=(sp)=>{setPe(p=>({...p,sprintId:sp.id,isFinal:!!sp.isFinal,label:sp.label,slots:Array(sp.isFinal?3:2).fill(null)}));};
  const savePointEntry=()=>{
    if(!pe||!pe.sprintId)return;
    const positions=pe.slots.map((a,i)=>a?{rank:i+1,athleteKey:nameKey(a),bib:a.bib,name:a.name,value:pointsForPosition(i+1,pe.isFinal)}:null).filter(Boolean);
    if(!positions.length)return;
    const index=structure.sprints.findIndex(s=>s.id===pe.sprintId);
    const lap=structure.neutralizedLaps+index*structure.frequency;
    if(pe.intent==='creation'){addLogEvent({id:rid(),seq:Date.now(),source:'sequencer',type:'POINT',sprintId:pe.sprintId,positions,videoTime:Math.round(cur()*10)/10,lap});}
    else{addLogEvent({id:rid(),seq:Date.now(),source:'sequencer',type:'POINT_CORRECTION',provenance:'sequencer',sprintId:pe.sprintId,positions,videoTime:Math.round(cur()*10)/10,lap});}
    reset();
  };

  const seqEvents=(race.log||[]).filter(e=>e.source==='sequencer'&&e.type!=='POINT_CONTEXT').slice().sort((a,b)=>(a.videoTime||0)-(b.videoTime||0));
  const evLabel=(e)=>e.type==='MOVE'?moveLabel(e.move):e.type==='CHUTE'?'Chute':e.type==='NOTE'?'Note':e.type==='POINT'?'Point (vidéo)':e.type==='POINT_CORRECTION'?'Point (corr.)':e.type;

  return (
    <div className="fixed inset-0 bg-zinc-950 z-50 flex flex-col safe-top">
      <header className="bg-black border-b border-zinc-800 px-3 py-2 flex items-center justify-between shrink-0">
        <div className="min-w-0"><div className="text-[9px] tracking-[0.25em] text-red-500 uppercase">🎬 Séquenceur</div><div className="text-sm font-bold truncate">{race.label}</div></div>
        <button onClick={onClose} className="px-3 py-2 border border-zinc-700 text-zinc-300 text-xs uppercase tracking-wider">Fermer</button>
      </header>

      <div className="flex-1 overflow-y-auto p-3 space-y-3">
        {/* bandeau mode */}
        <div className={`border p-2 ${mode==='video'?'border-orange-800 bg-orange-950/15':'border-zinc-800 bg-zinc-900/40'}`}>
          <div className="flex items-center justify-between">
            <div className="text-xs"><span className="text-zinc-500 uppercase text-[9px]">Mode</span> <span className={`font-bold ${mode==='video'?'text-orange-300':'text-zinc-200'}`}>{mode==='video'?'VIDÉO — création des points':'LIVE — enrichir / corriger'}</span></div>
          </div>
          <div className="flex gap-1 mt-1">
            {[['auto','Auto'],['live','Live'],['video','Vidéo']].map(([v,l])=><button key={v} onClick={()=>setRaceOrigin(v)} className={`flex-1 py-1 text-[10px] border ${(race.origin||'auto')===v?'border-red-500 bg-red-500/10 text-red-400':'border-zinc-800 text-zinc-500'}`}>{l}</button>)}
          </div>
        </div>

        {/* chrono + tours */}
        <div className="border border-zinc-800 p-3">
          <div className="text-center text-5xl font-bold tabular-nums" style={{fontFamily:'ui-monospace,monospace'}}>{fmt(cur())}</div>
          <div className="grid grid-cols-3 gap-1 mt-2">
            <button onClick={()=>setRunning(true)} disabled={running} className="py-2 border border-emerald-700 text-emerald-300 disabled:opacity-30 text-sm uppercase">Start</button>
            <button onClick={()=>{setElapsed(cur());setRunning(false);}} disabled={!running} className="py-2 border border-amber-700 text-amber-300 disabled:opacity-30 text-sm uppercase">Pause</button>
            <button onClick={()=>{if(confirm('Chrono à zéro ? (les tours restent)')){setRunning(false);setElapsed(0);}}} className="py-2 border border-zinc-700 text-zinc-400 text-sm uppercase">Reset</button>
          </div>
          <div className="flex items-center justify-center gap-3 mt-3">
            <button onClick={()=>{if(laps.length)popLap();}} className="w-12 h-11 border border-zinc-700 text-zinc-300 text-lg">−</button>
            <div className="text-center w-28"><div className="text-[9px] text-zinc-500 uppercase">Tour en cours</div><div className="text-2xl font-bold">{curLap}</div><div className="text-[9px] text-zinc-600">{laps.length} enreg.{laps.length?` · ${laps[laps.length-1].lapTime}s`:''}</div></div>
            <button onClick={tour} className="w-16 h-11 border border-red-700 bg-red-950/30 text-red-300 text-sm font-bold uppercase">+ Tour</button>
          </div>
          <button onClick={()=>setShowLaps(v=>!v)} className="w-full mt-2 py-1.5 border border-zinc-800 text-zinc-400 text-[10px] uppercase tracking-wider">{showLaps?'Masquer':'Voir'} les temps au tour</button>
          {showLaps && (<div className="mt-1 max-h-40 overflow-y-auto border border-zinc-800" style={{fontFamily:'ui-monospace,monospace'}}>{!laps.length&&<div className="px-2 py-2 text-zinc-600 text-xs">Aucun tour.</div>}{laps.map(l=>(<div key={l.lap} className="flex items-center gap-2 px-2 py-1 text-[11px] border-b border-zinc-900"><span className="text-zinc-400 w-12">Tour {l.lap}</span><span className="text-zinc-100 font-bold w-14">{l.lapTime}s</span><span className="text-zinc-600 w-14">{fmt(l.cumTime)}</span>{lapToLabel[l.lap]&&<span className="text-red-400">{lapToLabel[l.lap]}</span>}</div>))}</div>)}
        </div>

        {m==='home' && (<>
          <div>
            <div className="flex items-center justify-between mb-1"><div className="text-[10px] text-zinc-500 uppercase tracking-wider">Points {mode==='video'?'(créés vidéo)':'à enrichir'}</div>{mode==='video'?<button onClick={()=>startPointEntry('creation',null)} className="px-2 py-1 border border-orange-700 text-orange-300 text-[10px] uppercase">+ Créer un point</button>:<button onClick={()=>startPointEntry('correction',null)} className="px-2 py-1 border border-amber-700 text-amber-300 text-[10px] uppercase">+ Point manquant</button>}</div>
            {!points.length && <div className="text-xs text-zinc-600">{mode==='video'?'Aucun point créé. Utilise « Créer un point ».':'Aucun point live.'}</div>}
            <div className="space-y-1">
              {points.map(p=>(
                <div key={p.sprintId} className="border border-zinc-800 p-1.5">
                  <div className="text-[10px] text-zinc-500 mb-0.5 flex items-center gap-1"><span className={`font-bold ${p.isFinal?'text-red-500':'text-zinc-300'}`}>{p.isFinal?'ARR':'P'+p.label}</span><span>· T{p.lap}{p.videoTime!=null?` · ${fmt(p.videoTime)}`:''}{p.lapTime!=null?` · ${p.lapTime}s`:''}</span><span className={`ml-auto text-[8px] uppercase ${p.provenance==='live'?'text-zinc-600':p.isCorrection?'text-amber-500':'text-orange-400'}`}>{p.provenance==='live'?'live':p.isCorrection?'corrigé':'vidéo'}</span></div>
                  {p.positions.map(pos=>{const done=!!ctxMap[ctxKey(p.sprintId,pos.athleteKey)];return (
                    <div key={pos.rank} className="flex items-center gap-2 py-1 text-xs"><span className="font-bold text-red-500 w-9">{pos.bib}</span><span className="flex-1 truncate">{pos.name} <span className="text-zinc-500">+{pos.value}</span></span><button onClick={()=>startEnrich(p,pos)} className={`px-2 py-1 border text-[11px] ${done?'border-emerald-700 text-emerald-400':'border-zinc-700 text-zinc-300'}`}>{done?'✓':'Enrichir'}</button></div>);})}
                  {mode==='live' && <button onClick={()=>{const sp=structure.sprints.find(s=>s.id===p.sprintId);startPointEntry('correction',sp);}} className="w-full mt-1 py-1 border border-zinc-800 text-zinc-500 text-[10px]">Corriger ce point</button>}
                </div>))}
            </div>
          </div>

          <div>
            <div className="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">Move tactique</div>
            <div className="grid grid-cols-2 gap-1">{SEQ_MOVES.map(([id,label])=><button key={id} onClick={()=>startMove(id)} className="py-3 border border-zinc-700 text-zinc-200 text-sm active:bg-zinc-800">{label}</button>)}</div>
            <div className="grid grid-cols-2 gap-1 mt-1"><button onClick={()=>incident('CHUTE')} className="py-2 border border-zinc-800 text-zinc-400 text-xs">Chute</button><button onClick={()=>incident('NOTE')} className="py-2 border border-zinc-800 text-zinc-400 text-xs">Note</button></div>
          </div>

          <div>
            <div className="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">Séquence · {seqEvents.length}</div>
            <div className="space-y-px">{seqEvents.map(e=>(<div key={e.id} className="flex items-center gap-2 text-xs py-1.5 px-1 border-b border-zinc-900"><span className="text-zinc-500 tabular-nums w-10" style={{fontFamily:'ui-monospace,monospace'}}>{fmt(e.videoTime)}</span><span className="text-zinc-600 w-7">T{e.lap}</span><span className="text-zinc-200 w-24 truncate">{evLabel(e)}</span><span className="flex-1 truncate text-zinc-400">{e.type==='POINT'||e.type==='POINT_CORRECTION'?(e.positions||[]).map(p=>`${p.bib}+${p.value}`).join(' '):(e.actorBib||'')+(e.targetBib?`→${e.targetBib}`:'')+(e.outcome?` · ${(MOVE_OUTCOMES.find(o=>o[0]===e.outcome)||['',''])[1].toLowerCase()}`:'')+(e.note?` · ${e.note}`:'')}</span><button onClick={()=>deleteLogEvent(e.id)} className="text-zinc-600 px-1">🗑</button></div>))}{!seqEvents.length&&<div className="text-xs text-zinc-600">Rien de tagué.</div>}</div>
          </div>
        </>)}

        {/* PANNEAU MOVE / INCIDENT */}
        {m==='move' && (
          <div className="border border-red-700 bg-red-950/10 p-3 space-y-2">
            <div className="flex items-center justify-between"><div className="text-sm font-bold">{moveId==='CHUTE'?'Chute':moveId==='NOTE'?'Note':moveLabel(moveId)} <span className="text-zinc-500">· {fmt(frozen.videoTime)} · T{frozen.lap}</span></div><button onClick={reset} className="text-zinc-500 text-xs">Annuler</button></div>
            {moveId!=='NOTE' && (actor?(<div className="flex items-center gap-2 px-2 py-2 border border-zinc-700 bg-zinc-900"><span className="text-[9px] text-zinc-500 uppercase">{moveId==='CHUTE'?'COUREUR':'ACTEUR'}</span><span className="font-bold text-red-500">{actor.bib}</span><span className="flex-1 truncate text-sm">{actor.name}</span><button onClick={()=>{setActor(null);setPick('actor');}} className="text-zinc-500 px-1">✕</button></div>):pick==='actor'?(<SeqPicker skaters={skaters} roles={roles} pointsById={pointsById} rankById={rankById} exclude={target?[target.id]:[]} onPick={(s)=>{setActor(s);setPick(null);}} />):<button onClick={()=>setPick('actor')} className="w-full py-2 border border-zinc-700 text-zinc-400 text-sm">+ Acteur</button>)}
            {moveId!=='CHUTE'&&moveId!=='NOTE'&&needsTarget(moveId)&&(target?(<div className="flex items-center gap-2 px-2 py-2 border border-zinc-800 bg-zinc-900"><span className="text-[9px] text-zinc-500 uppercase">CIBLE</span><span className="font-bold text-red-500">{target.bib}</span><span className="flex-1 truncate text-sm">{target.name}</span><button onClick={()=>setTarget(null)} className="text-zinc-500 px-1">✕</button></div>):pick==='target'?(<SeqPicker skaters={skaters} roles={roles} pointsById={pointsById} rankById={rankById} exclude={actor?[actor.id]:[]} onPick={(s)=>{setTarget(s);setPick(null);}} />):<button onClick={()=>setPick('target')} className="w-full py-1.5 border border-zinc-800 text-zinc-500 text-xs">+ Cible</button>)}
            {moveId!=='CHUTE'&&moveId!=='NOTE'&&<><TagRow label="Issue" options={MOVE_OUTCOMES} value={outcome} onChange={setOutcome} /><TagRow label="Coût (1-5)" options={TAG_VOCAB.cost} value={mcost} onChange={setMcost} /></>}
            <input value={note} onChange={e=>setNote(e.target.value)} placeholder="note (optionnel)" className="w-full bg-black border border-zinc-700 px-2 py-2 text-sm outline-none focus:border-red-500" />
            <button onClick={moveId==='CHUTE'||moveId==='NOTE'?()=>{addLogEvent({id:rid(),seq:Date.now(),source:'sequencer',type:moveId,actorKey:actor?nameKey(actor):null,actorBib:actor?actor.bib:null,videoTime:Math.round(frozen.videoTime*10)/10,lap:frozen.lap,note:note.trim()});reset();}:saveMove} className="w-full py-3 bg-red-600 active:bg-red-500 text-white text-sm font-bold uppercase tracking-wider">Enregistrer</button>
          </div>
        )}

        {/* PANNEAU ENRICHISSEMENT */}
        {m==='enrich' && enrich && (
          <div className="border border-emerald-700 bg-emerald-950/10 p-3 space-y-2">
            <div className="flex items-center justify-between"><div className="text-sm font-bold">Enrichir {enrich.isFinal?'ARR':'P'+enrich.label} · <span className="text-red-500">{enrich.bib}</span> {enrich.name} +{enrich.value}</div><button onClick={reset} className="text-zinc-500 text-xs">Annuler</button></div>
            <TagRow label="Contexte" options={TAG_VOCAB.context} value={etags.context} onChange={v=>setEtags(t=>({...t,context:v}))} />
            <TagRow label="Position avant le point" options={TAG_VOCAB.positionBefore} value={etags.positionBefore} onChange={v=>setEtags(t=>({...t,positionBefore:v}))} />
            <TagRow label="Coût énergétique (1-5)" options={TAG_VOCAB.cost} value={etags.cost} onChange={v=>setEtags(t=>({...t,cost:v}))} />
            <button onClick={saveEnrich} className="w-full py-3 bg-emerald-700 active:bg-emerald-600 text-white text-sm font-bold uppercase tracking-wider">Enregistrer le contexte</button>
            <div className="text-[9px] text-zinc-600">Le score (qui / combien) n'est pas modifié. Enrichissement par coureur.</div>
          </div>
        )}

        {/* PANNEAU CRÉATION / CORRECTION DE POINT */}
        {m==='pointentry' && pe && (
          <div className={`border p-3 space-y-2 ${pe.intent==='creation'?'border-orange-700 bg-orange-950/10':'border-amber-700 bg-amber-950/10'}`}>
            <div className="flex items-center justify-between"><div className={`text-sm font-bold ${pe.intent==='creation'?'text-orange-300':'text-amber-300'}`}>{pe.intent==='creation'?'Créer un point (vidéo)':'Corriger / ajouter un point'}</div><button onClick={reset} className="text-zinc-500 text-xs">Annuler</button></div>
            {!pe.sprintId?(<>
              <div className="text-[9px] text-zinc-500 uppercase">Choisir le point</div>
              <div className="flex flex-wrap gap-1 max-h-24 overflow-y-auto">{structure.sprints.map(sp=><button key={sp.id} onClick={()=>peChooseSprint(sp)} className="px-2 py-1 text-[11px] border border-zinc-800 text-zinc-400">{sp.isFinal?'ARR':sp.label}</button>)}</div>
            </>):(<>
              <div className="text-xs">Point <span className="font-bold text-red-400">{pe.isFinal?'ARR':'P'+pe.label}</span> <button onClick={()=>setPe(p=>({...p,sprintId:null}))} className="text-zinc-500 text-[10px] underline ml-1">changer</button></div>
              {pe.slots.map((a,i)=>(<div key={i} className="flex items-center gap-2">
                <span className="w-10 text-center bg-zinc-900 border border-zinc-800 py-1.5 text-sm font-bold">P{i+1}</span>
                {a?(<div className="flex-1 flex items-center gap-2 px-2 py-1.5 border border-zinc-700 bg-zinc-900"><span className="font-bold text-red-500">{a.bib}</span><span className="flex-1 truncate text-sm">{a.name}</span><span className="text-red-400 text-xs">+{pointsForPosition(i+1,pe.isFinal)}</span><button onClick={()=>setPe(p=>{const s=[...p.slots];s[i]=null;return{...p,slots:s};})} className="text-zinc-500 px-1">✕</button></div>):pick==='pe'+i?(<div className="flex-1"><SeqPicker skaters={skaters} roles={roles} pointsById={pointsById} rankById={rankById} exclude={pe.slots.filter(Boolean).map(x=>x.id)} onPick={(s)=>{setPe(p=>{const sl=[...p.slots];sl[i]=s;return{...p,slots:sl};});setPick(null);}} /></div>):(<button onClick={()=>setPick('pe'+i)} className="flex-1 py-1.5 border border-zinc-700 text-zinc-400 text-sm text-left px-2">choisir…</button>)}
              </div>))}
              <button onClick={savePointEntry} disabled={!pe.slots.some(Boolean)} className={`w-full py-3 disabled:opacity-40 text-white text-sm font-bold uppercase tracking-wider ${pe.intent==='creation'?'bg-orange-700 active:bg-orange-600':'bg-amber-700 active:bg-amber-600'}`}>{pe.intent==='creation'?'Créer ce point':'Enregistrer la correction'}</button>
              <div className="text-[9px] text-zinc-600">{pe.intent==='creation'?'Point source vidéo (provenance sequencer).':'Correction explicite — l\'info live d\'origine est conservée.'}</div>
            </>)}
          </div>
        )}

        <div className="text-[9px] text-zinc-600 safe-bottom">Append-only · le live n'est jamais modifié. Live &gt; correction &gt; vidéo.</div>
      </div>
    </div>
  );
}


function ImportModal({onClose,onImport}){
  const [tab,setTab]=useState('photo');
  const [loading,setLoading]=useState(false);
  const [progress,setProgress]=useState('');
  const [error,setError]=useState(null);
  const [preview,setPreview]=useState(null);
  const [text,setText]=useState('');

  const fileToB64=(file)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(new Error('lecture impossible'));r.readAsDataURL(file);});

  // plusieurs fichiers (images et/ou PDF) traités comme UNE seule startlist
  const doFiles=async(e)=>{
    const files=Array.from(e.target.files||[]);if(!files.length)return;
    setLoading(true);setError(null);setPreview(null);
    const batches=[];const errs=[];
    for(let i=0;i<files.length;i++){
      const f=files[i];setProgress(`Analyse ${i+1}/${files.length} — ${f.name}`);
      try{
        const b64=await fileToB64(f);
        const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);
        const list=await importViaApi(isPdf?{pdfData:b64}:{imageData:b64,mediaType:f.type||'image/jpeg'});
        batches.push(list);
      }catch(err){errs.push(`${f.name}: ${err.message}`);}
    }
    setProgress('');
    const merged=mergeRosters(batches);
    if(!merged.length){setError(errs[0]||'Aucun coureur détecté sur les fichiers fournis.');}
    else{setPreview(merged);if(errs.length)setError(`${errs.length} fichier(s) en erreur — le reste a été fusionné.`);}
    setLoading(false);
  };
  const doText=()=>{if(!text.trim())return;setError(null);setPreview(null);try{const list=parseLocalRoster(text);const merged=mergeRosters([list]);merged.length?setPreview(merged):setError('Aucun coureur reconnu. Vérifie que chaque ligne commence par un dossard.');}catch(err){setError(err.message);}};

  return (
    <div className="fixed inset-0 bg-black/85 z-50 flex items-end sm:items-center justify-center">
      <div className="bg-zinc-950 border border-zinc-700 w-full sm:max-w-lg max-h-[90vh] overflow-y-auto safe-bottom">
        <div className="border-b border-zinc-800 px-4 py-3 flex justify-between items-center sticky top-0 bg-zinc-950"><h2 className="text-sm font-bold uppercase tracking-wider">Import starting list</h2><button onClick={onClose} className="text-zinc-500 active:text-red-500 text-xl px-2">✕</button></div>
        <div className="p-4">
          <div className="flex gap-1 mb-4">{[['photo','📷 Photos / PDF (IA)'],['paste','📋 Texte (gratuit)'],['manual','✎ Manuel']].map(([id,lbl])=><button key={id} onClick={()=>{setTab(id);setPreview(null);setError(null);}} className={`flex-1 py-2 text-[11px] uppercase border ${tab===id?'border-red-500 text-red-400':'border-zinc-800 text-zinc-500'}`}>{lbl}</button>)}</div>
          {tab==='photo'&&<div>
            <p className="text-xs text-zinc-400 mb-3">Sélectionne <span className="text-zinc-200">une ou plusieurs</span> photos / captures / PDF. Tout est fusionné en une seule liste, doublons (même dossard) supprimés. <span className="text-zinc-500">(via IA Anthropic — nécessite la clé API)</span></p>
            <input type="file" accept="image/*,application/pdf" multiple onChange={doFiles} disabled={loading} className="block w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-4 file:border-0 file:bg-red-600 file:text-white file:text-xs file:uppercase" />
            <p className="text-[10px] text-zinc-600 mt-2">Astuce : sélectionne les 3 captures (401-420, 421-440, 441-460) d'un coup → un seul roster.</p>
          </div>}
          {tab==='paste'&&<div>
            <p className="text-xs text-zinc-400 mb-2">Solution <span className="text-emerald-400">gratuite, sans clé API</span>. Sur iPhone : appui long sur ta capture → « Copier le texte » (Live Text) → colle ici → l'app structure le roster localement.</p>
            <textarea value={text} onChange={e=>setText(e.target.value)} rows={6} placeholder={"464 BEDDIAF Nolan SEH-MANAO\n449 ROCHER Matthis SEH-MANAO\n446 COLIN Louis SEH-ROLLER SPORTS SAINT-PIERRAIS"} className="w-full bg-black border border-zinc-700 p-3 text-xs outline-none focus:border-red-500" />
            <button onClick={doText} disabled={!text.trim()} className="mt-2 w-full py-2 bg-red-600 active:bg-red-500 disabled:opacity-40 text-white text-xs uppercase tracking-wider">Structurer le texte (local)</button>
          </div>}
          {tab==='manual'&&<ManualEntry onSave={onImport} />}
          {loading&&<div className="mt-3 text-xs text-amber-400">{progress||'Analyse en cours…'}</div>}
          {error&&<div className="mt-3 text-xs text-amber-400 border border-amber-900 bg-amber-950/30 p-2">⚠ {error}</div>}
          {preview&&(
            <div className="mt-4 border border-emerald-700 bg-emerald-950/20 p-3">
              <div className="text-xs text-emerald-400 uppercase mb-2">✓ {preview.length} coureurs (doublons fusionnés)</div>
              <div className="max-h-52 overflow-y-auto space-y-px text-xs">{preview.map(p=><div key={p.id} className="flex items-center gap-2 py-1"><span className="font-bold text-red-500 w-9">#{p.bib}</span><span className="flex-1 truncate">{p.name}</span><span className="truncate max-w-[90px]" style={{color:clubColor(p.club)}}>{clubShort(p.club)}</span><span>{flag(p.nat)}</span></div>)}</div>
              <button onClick={()=>onImport(preview)} className="w-full mt-3 py-2 bg-red-600 active:bg-red-500 text-white text-xs uppercase tracking-wider">Importer ce roster</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
function ManualEntry({onSave}){
  const [rows,setRows]=useState([{bib:'',name:'',club:'',nat:'FRA'}]);
  const upd=(i,f,v)=>setRows(r=>{const c=[...r];c[i]={...c[i],[f]:v};return c;});
  const save=()=>{const list=rows.filter(r=>r.bib&&r.name).map((r,i)=>({id:i+1,bib:Number(r.bib),name:r.name,club:r.club,nat:(r.nat||'FRA').toUpperCase(),cat:'Senior',status:null}));if(list.length)onSave(list);};
  return (
    <div>
      <div className="space-y-1 max-h-72 overflow-y-auto">{rows.map((r,i)=>(
        <div key={i} className="flex gap-1">
          <input value={r.bib} onChange={e=>upd(i,'bib',e.target.value)} placeholder="N°" inputMode="numeric" className="w-12 bg-black border border-zinc-700 px-2 py-1.5 text-xs" />
          <input value={r.name} onChange={e=>upd(i,'name',e.target.value)} placeholder="Nom" className="flex-1 bg-black border border-zinc-700 px-2 py-1.5 text-xs" />
          <input value={r.club} onChange={e=>upd(i,'club',e.target.value)} placeholder="Club" className="w-20 bg-black border border-zinc-700 px-2 py-1.5 text-xs" />
          <button onClick={()=>setRows(rows.filter((_,x)=>x!==i))} className="px-2 text-zinc-500">✕</button>
        </div>))}</div>
      <div className="flex gap-2 mt-2"><button onClick={()=>setRows([...rows,{bib:'',name:'',club:'',nat:'FRA'}])} className="px-3 py-1.5 border border-zinc-700 text-zinc-400 text-xs">+ Ligne</button><button onClick={save} className="flex-1 py-1.5 bg-red-600 active:bg-red-500 text-white text-xs uppercase tracking-wider">Sauver ({rows.filter(r=>r.bib&&r.name).length})</button></div>
    </div>
  );
}

// ============================================================
// HELPERS UI
// ============================================================
function Block({title,children}){return <div><div className="text-[10px] tracking-[0.25em] text-zinc-500 uppercase mb-2">{title}</div><div className="space-y-2">{children}</div></div>;}
function Field({label,children}){return <div><label className="text-[10px] text-zinc-400 uppercase tracking-wider">{label}</label><div className="mt-1">{children}</div></div>;}
function Stat({label,value}){return <div className="flex flex-col items-center py-1 border-b border-zinc-900"><span className="text-sm font-bold">{value}</span><span className="text-[9px] text-zinc-500 uppercase">{label}</span></div>;}
function Info({label,value,accent}){return <div className="bg-zinc-950 py-1.5"><div className="text-[8px] text-zinc-500 uppercase tracking-wider">{label}</div><div className={`text-lg font-bold leading-none ${accent?'text-red-500':'text-zinc-200'}`}>{value}</div></div>;}
function Choice({label,options,value,onChange}){return <div><label className="text-[10px] text-zinc-400 uppercase tracking-wider">{label}</label><div className="grid gap-1 mt-1" style={{gridTemplateColumns:`repeat(${options.length},1fr)`}}>{options.map(o=><button key={o} onClick={()=>onChange(o)} className={`py-2 text-xs border ${value===o?'bg-red-600 border-red-600 text-white':'border-zinc-700 text-zinc-400'}`}>{o}</button>)}</div></div>;}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
