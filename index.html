const { useState, useMemo, useEffect, useRef, useCallback } = React;

// ============================================================
// MOTEUR DE SCORING
// ============================================================
const CATEGORIES = ['Senior', 'Junior', 'Youth'];
const DISCIPLINES = ['Piste', 'Route'];

function getSprintFrequency(category, discipline) {
  if (category === 'Youth' && discipline === 'Piste') return 2;
  return 1;
}
function getOfficialDistance(category, discipline) {
  if (category === 'Youth') return 5000;
  if (discipline === 'Piste') return 5000;
  return 10000;
}
function computeNeutralizedLaps(circuitLength) {
  const MIN = 999; // tolérance 1 m (333×3 = 999 accepté)
  let n = 1;
  while (n * circuitLength < MIN) n++;
  return n;
}
function buildRaceConfig({ category, discipline, totalDistance, circuitLength }) {
  const totalLaps = Math.round(totalDistance / circuitLength);
  const neutralizedLaps = computeNeutralizedLaps(circuitLength);
  const pointedLaps = totalLaps - neutralizedLaps;
  const frequency = getSprintFrequency(category, discipline);
  const sprints = [];
  if (frequency === 1) {
    for (let i = pointedLaps; i >= 1; i--)
      sprints.push({ id: sprints.length + 1, label: `${i}`, lapsRemaining: i, isFinal: false });
    sprints.push({ id: sprints.length + 1, label: 'ARRIVÉE', lapsRemaining: 0, isFinal: true });
  } else {
    for (let i = pointedLaps; i >= 2; i -= 2)
      sprints.push({ id: sprints.length + 1, label: `${i}`, lapsRemaining: i, isFinal: false });
    sprints.push({ id: sprints.length + 1, label: 'ARRIVÉE', lapsRemaining: 0, isFinal: true });
  }
  const firstSprintDistance = neutralizedLaps * circuitLength;
  const warnings = [];
  if (firstSprintDistance > 1300) warnings.push(`1er sprint à ${firstSprintDistance} m — vérifier le circuit.`);
  return { category, discipline, totalDistance, circuitLength, totalLaps, neutralizedLaps, pointedLaps, frequency, sprints, firstSprintDistance, warnings };
}
function pointsForPosition(position, isFinal) {
  if (isFinal) return position === 1 ? 3 : position === 2 ? 2 : position === 3 ? 1 : 0;
  return position === 1 ? 2 : position === 2 ? 1 : 0;
}
function computeRanking(skaters, sprintResults, lapChanges) {
  const data = skaters.map(s => ({
    ...s,
    laps: lapChanges[s.id] || 0,
    points: 0, lastSprintPosition: null, finishPosition: null,
    lappedOut: (lapChanges[s.id] || 0) < 0,
    statusVoid: s.status === 'DNF' || s.status === 'DSQ',
  }));
  const sorted = [...sprintResults].sort((a, b) => a.sprintId - b.sprintId);
  sorted.forEach(sprint => {
    sprint.positions.forEach((sid, idx) => {
      const sk = data.find(d => d.id === sid);
      if (!sk) return;
      sk.points += pointsForPosition(idx + 1, sprint.isFinal);
      sk.lastSprintPosition = idx + 1;
      if (sprint.isFinal) sk.finishPosition = idx + 1;
    });
  });
  data.forEach(d => { if (d.lappedOut || d.statusVoid) d.points = 0; });
  data.sort((a, b) => {
    if (a.statusVoid && !b.statusVoid) return 1;
    if (!a.statusVoid && b.statusVoid) return -1;
    if (b.laps !== a.laps) return b.laps - a.laps;
    if (b.points !== a.points) return b.points - a.points;
    const aL = a.lastSprintPosition ?? 9999, bL = b.lastSprintPosition ?? 9999;
    if (aL !== bL) return aL - bL;
    return (a.finishPosition ?? 9999) - (b.finishPosition ?? 9999);
  });
  return data.map((d, i) => ({ ...d, rank: i + 1 }));
}
// Classement par équipe (club) : somme des points des coureurs du club
function computeTeamRanking(ranking) {
  const teams = {};
  ranking.forEach(r => {
    const club = r.club || '—';
    if (!teams[club]) teams[club] = { club, points: 0, skaters: [], bestRank: 9999 };
    teams[club].points += r.points;
    teams[club].skaters.push(r);
    teams[club].bestRank = Math.min(teams[club].bestRank, r.rank);
  });
  return Object.values(teams)
    .filter(t => t.skaters.length > 0)
    .sort((a, b) => b.points - a.points || a.bestRank - b.bestRank);
}

// ============================================================
// SEARCH
// ============================================================
function normalize(str) {
  return (str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
}
function scoreMatch(s, nq) {
  const name = normalize(s.name), club = normalize(s.club);
  if (name.startsWith(nq)) return 100;
  if (name.includes(nq)) return 50;
  if (club.startsWith(nq)) return 25;
  if (club.includes(nq)) return 10;
  return 0;
}
function searchSkaters(skaters, query) {
  if (!query) return skaters;
  const q = query.trim();
  if (/^\d+$/.test(q)) {
    const exact = skaters.find(s => String(s.bib) === q);
    if (exact) return [exact, ...skaters.filter(s => s !== exact && String(s.bib).startsWith(q))];
    return skaters.filter(s => String(s.bib).startsWith(q));
  }
  const nq = normalize(q);
  return skaters.map(s => ({ s, score: scoreMatch(s, nq) })).filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score).map(x => x.s);
}
function resolveVoiceTerm(term, skaters) {
  const num = term.match(/\d+/);
  if (num) return skaters.find(s => s.bib === parseInt(num[0], 10)) || null;
  return searchSkaters(skaters, term)[0] || null;
}
// convertit "quarante-sept" -> 47 (FR), tolérant
const FR_UNITS = { zero:0,zéro:0,un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,onze:11,douze:12,treize:13,quatorze:14,quinze:15,seize:16,vingt:20,trente:30,quarante:40,cinquante:50,soixante:60,cent:100 };
function frWordsToNumber(words) {
  let total = 0, found = false;
  words.forEach(w => {
    const k = w.replace(/s$/, '');
    if (FR_UNITS[k] !== undefined) { total += FR_UNITS[k]; found = true; }
  });
  return found ? total : null;
}
function parseVoiceTranscript(transcript, skaters) {
  // découpe par séparateurs explicites
  const chunks = transcript.replace(/\bet\b|\bpuis\b|\bensuite\b|\bvirgule\b/gi, '|').split('|');
  const found = [];
  const tryAdd = (sk) => { if (sk && !found.some(f => f.id === sk.id)) found.push(sk); };
  chunks.forEach(chunk => {
    const tokens = chunk.trim().split(/[\s,]+/).filter(Boolean);
    if (!tokens.length) return;
    // chiffres directs
    const directNum = tokens.find(t => /^\d+$/.test(t));
    if (directNum) { tryAdd(resolveVoiceTerm(directNum, skaters)); return; }
    // nombre en lettres
    const asNum = frWordsToNumber(tokens);
    if (asNum) { const sk = skaters.find(s => s.bib === asNum); if (sk) { tryAdd(sk); return; } }
    // sinon nom
    tryAdd(resolveVoiceTerm(chunk.trim(), skaters));
  });
  return found;
}

const FLAG_MAP = { FRA:'🇫🇷',ITA:'🇮🇹',KOR:'🇰🇷',COL:'🇨🇴',GER:'🇩🇪',BRA:'🇧🇷',JPN:'🇯🇵',BEL:'🇧🇪',NED:'🇳🇱',USA:'🇺🇸',ESP:'🇪🇸',CHI:'🇨🇱',ARG:'🇦🇷',CHN:'🇨🇳',TPE:'🇹🇼',ECU:'🇪🇨',VEN:'🇻🇪',MEX:'🇲🇽',AUS:'🇦🇺',NZL:'🇳🇿',POR:'🇵🇹',SUI:'🇨🇭',POL:'🇵🇱',CZE:'🇨🇿',SVK:'🇸🇰',DEN:'🇩🇰' };
const flag = (c) => FLAG_MAP[(c||'').toUpperCase()] || '🏁';
function clubColor(club) {
  if (!club) return '#52525b';
  let h = 0;
  for (let i = 0; i < club.length; i++) h = club.charCodeAt(i) + ((h << 5) - h);
  const hue = Math.abs(h) % 360;
  return `hsl(${hue}, 65%, 55%)`;
}
function clubShort(club) {
  if (!club) return '—';
  return club.split(/[-–]/)[0].trim().split(/\s+/).slice(0, 2).join(' ');
}

// PERSISTANCE (localStorage)
// ============================================================
const LS = {
  get(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ============================================================
// IMPORT (via /api/extract)
// ============================================================
async function importViaApi({ imageData, mediaType, text }) {
  const res = await fetch('/api/extract', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ imageData, mediaType, text }),
  });
  let data;
  try { data = await res.json(); } catch { throw new Error("Import photo/texte : à activer à l'étape 2 (fonction serveur). La saisie manuelle marche déjà."); }
  if (!res.ok || data.error) throw new Error(data.error || "Import à activer à l'étape 2 (fonction serveur).");
  return (data.skaters || []).map((s, i) => ({ id: i + 1, ...s, status: null }));
}

// APP
// ============================================================
function App() {
  const [tab, setTab] = useState('saisie'); // course | saisie | classement
  const [category, setCategory] = useState(() => LS.get('cfg_cat', 'Senior'));
  const [discipline, setDiscipline] = useState(() => LS.get('cfg_disc', 'Piste'));
  const [circuitLength, setCircuitLength] = useState(() => LS.get('cfg_circ', 200));
  const [totalDistance, setTotalDistance] = useState(() => LS.get('cfg_dist', 5000));

  const [skaters, setSkaters] = useState(() => LS.get('skaters', DEFAULT_LIST));
  const [favorites, setFavorites] = useState(() => LS.get('favorites', []));
  const [sprintResults, setSprintResults] = useState(() => LS.get('sprintResults', []));
  const [lapChanges, setLapChanges] = useState(() => LS.get('lapChanges', {}));
  const [activeSprintIdx, setActiveSprintIdx] = useState(0);
  const [showImport, setShowImport] = useState(false);
  const [toast, setToast] = useState(null);
  const [lastSprintId, setLastSprintId] = useState(null); // pour les flèches ↑↓
  const toastTimer = useRef(null);

  const showToast = (msg, type) => {
    setToast({ msg, type });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2800);
  };

  // persistance
  useEffect(() => LS.set('skaters', skaters), [skaters]);
  useEffect(() => LS.set('favorites', favorites), [favorites]);
  useEffect(() => LS.set('sprintResults', sprintResults), [sprintResults]);
  useEffect(() => LS.set('lapChanges', lapChanges), [lapChanges]);
  useEffect(() => { LS.set('cfg_cat', category); LS.set('cfg_disc', discipline); LS.set('cfg_circ', circuitLength); LS.set('cfg_dist', totalDistance); }, [category, discipline, circuitLength, totalDistance]);

  const config = useMemo(() => buildRaceConfig({ category, discipline, totalDistance, circuitLength }), [category, discipline, totalDistance, circuitLength]);

  const resetRace = () => { setSprintResults([]); setLapChanges({}); setActiveSprintIdx(0); };
  const onCat = (c) => { setCategory(c); setTotalDistance(getOfficialDistance(c, discipline)); resetRace(); };
  const onDisc = (d) => { setDiscipline(d); setTotalDistance(getOfficialDistance(category, d)); resetRace(); };

  const recordSprint = (sprintId, isFinal, positions) => {
    const nr = { sprintId, isFinal, positions: positions.filter(Boolean).map(Number) };
    setSprintResults(prev => {
      const i = prev.findIndex(s => s.sprintId === sprintId);
      if (i >= 0) { const c = [...prev]; c[i] = nr; return c; }
      return [...prev, nr];
    });
    setLastSprintId(sprintId);
  };
  const setLap = (id, v) => {
    setLapChanges(prev => ({ ...prev, [id]: v }));
    const sk = skaters.find(s => s.id === id);
    if (sk) {
      if (v === 1) showToast(`+1 TOUR · ${sk.bib} ${sk.name}`, 'gain');
      else if (v === -1) showToast(`LAPPÉ · ${sk.bib} ${sk.name} — points annulés`, 'loss');
    }
  };
  const setStatus = (id, st) => {
    setSkaters(prev => prev.map(s => s.id === id ? { ...s, status: s.status === st ? null : st } : s));
    const sk = skaters.find(s => s.id === id);
    if (sk && sk.status !== st) showToast(`${st} · ${sk.bib} ${sk.name}`, 'loss');
  };
  const toggleFav = (id) => setFavorites(prev => prev.includes(id) ? prev.filter(f => f !== id) : [...prev, id]);
  const importSkaters = (list) => { setSkaters(list); resetRace(); setShowImport(false); };

  const ranking = useMemo(() => computeRanking(skaters, sprintResults, lapChanges), [skaters, sprintResults, lapChanges]);
  // classement AVANT le dernier sprint validé → pour calculer les mouvements ↑↓
  const prevRanking = useMemo(() => {
    if (lastSprintId == null) return null;
    const without = sprintResults.filter(s => s.sprintId !== lastSprintId);
    if (without.length === sprintResults.length) return null;
    return computeRanking(skaters, without, lapChanges);
  }, [skaters, sprintResults, lapChanges, lastSprintId]);
  const rankingWithMove = useMemo(() => {
    if (!prevRanking) return ranking.map(r => ({ ...r, move: 0 }));
    const map = {}; prevRanking.forEach(p => { map[p.id] = p.rank; });
    return ranking.map(r => ({ ...r, move: map[r.id] != null ? map[r.id] - r.rank : 0 }));
  }, [ranking, prevRanking]);
  // points encore distribuables (sprints non encore enregistrés)
  const pointsInfo = useMemo(() => {
    const recordedIds = new Set(sprintResults.map(s => s.sprintId));
    let total = 0, maxSolo = 0;
    config.sprints.forEach(sp => {
      if (recordedIds.has(sp.id)) return;
      total += sp.isFinal ? 6 : 3;       // 3+2+1 ou 2+1
      maxSolo += sp.isFinal ? 3 : 2;     // ce qu'un seul coureur peut encore rafler
    });
    return { total, maxSolo, remaining: config.sprints.length - sprintResults.length };
  }, [config, sprintResults]);

  const teamRanking = useMemo(() => computeTeamRanking(ranking), [ranking]);
  const activeSprint = config.sprints[activeSprintIdx];
  const recordedCount = sprintResults.length;

  return (
    <div className="flex flex-col h-full bg-zinc-950 no-tap-highlight">

      <header className="safe-top bg-black border-b border-zinc-800 px-4 pt-2 pb-3 flex items-center justify-between shrink-0">

          <div className="text-[9px] tracking-[0.3em] text-red-500 uppercase">Course à Points</div>
          <h1 className="text-lg font-bold leading-none">RACE ENGINE <span className="text-red-500">/</span> v1</h1>
        </div>
        <div className="text-right">
          <div className="text-[10px] text-zinc-500 uppercase">{category} · {discipline}</div>
          <div className="text-xs text-zinc-300">{recordedCount}/{config.sprints.length} sprints</div>
        </div>
      </header>

      {/* CONTENT */}
      <main className="flex-1 overflow-y-auto">
        {tab === 'course' && (
          <CourseTab {...{ category, discipline, circuitLength, totalDistance, onCat, onDisc, setCircuitLength, setTotalDistance, resetRace, config, skaters, favorites, toggleFav, setShowImport, activeSprintIdx, setActiveSprintIdx, sprintResults, setTab }} />
        )}
        {tab === 'saisie' && (
          <SaisieTab {...{ config, activeSprint, activeSprintIdx, setActiveSprintIdx, skaters, favorites, sprintResults, recordSprint, lapChanges, setLap, setStatus, pointsInfo }} />
        )}
        {tab === 'classement' && (
          <ClassementTab {...{ ranking: rankingWithMove, teamRanking, favorites, pointsInfo }} />
        )}
      </main>

      {/* TOAST prises de tour / statuts */}
      {toast && (
        <div className={`fixed left-1/2 -translate-x-1/2 z-40 px-4 py-2.5 border-2 text-sm font-bold uppercase tracking-wider flex items-center gap-2 ${
          toast.type === 'gain' ? 'bg-emerald-950 border-emerald-500 text-emerald-300' : 'bg-red-950 border-red-500 text-red-300'
        }`} style={{ bottom: 'calc(env(safe-area-inset-bottom) + 72px)', maxWidth: '92vw' }}>
          <span className="text-lg">{toast.type === 'gain' ? '▲' : '▼'}</span>
          <span className="truncate">{toast.msg}</span>
        </div>
      )}

      {/* BOTTOM TABS */}
      <nav className="safe-bottom bg-black border-t border-zinc-800 grid grid-cols-3 shrink-0">
        {[
          { id: 'course', label: 'COURSE', icon: '⚙' },
          { id: 'saisie', label: 'SAISIE', icon: '⏱' },
          { id: 'classement', label: 'CLASSEMENT', icon: '🏆' },
        ].map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            className={`py-3 flex flex-col items-center gap-0.5 transition ${tab === t.id ? 'text-red-500' : 'text-zinc-500'}`}>

      </nav>

      {showImport && <ImportModal onClose={() => setShowImport(false)} onImport={importSkaters} />}

  );
}

// ============================================================
// FAST SPRINT INPUT — mode course (clavier num, dossard d'abord, auto-avance)
// ============================================================
function FastSprintInput({ sprint, skaters, favorites, existing, onSubmit }) {
  const slots = sprint.isFinal ? 3 : 2;
  const pts = sprint.isFinal ? [3, 2, 1] : [2, 1];
  const init = () => existing ? Array.from({ length: slots }, (_, i) => existing.positions[i] || null) : Array(slots).fill(null);
  const [picks, setPicks] = useState(init);
  const [active, setActive] = useState(() => { const p = init(); const e = p.findIndex(x => !x); return e === -1 ? 0 : e; });
  const [query, setQuery] = useState('');
  const [numeric, setNumeric] = useState(true);
  const inputRef = useRef(null);

  useEffect(() => {
    const p = init();
    setPicks(p);
    const e = p.findIndex(x => !x);
    setActive(e === -1 ? 0 : e);
    setQuery('');
  }, [sprint.id]);

  const excludeIds = picks.filter((p, i) => p && i !== active);
  const results = useMemo(() => {
    const avail = skaters.filter(s => !excludeIds.includes(s.id));
    let res = searchSkaters(avail, query);
    if (!query) { const f = res.filter(s => favorites.includes(s.id)); res = [...f, ...res.filter(s => !favorites.includes(s.id))]; }
    return res.slice(0, 12);
  }, [skaters, query, picks, active, favorites]);

  const allFilled = picks.every(Boolean);

  const selectSkater = (id) => {
    const c = [...picks];
    c[active] = id;
    setPicks(c);
    setQuery('');
    let next = -1;
    for (let i = 0; i < slots; i++) { if (!c[i]) { next = i; break; } }
    if (next !== -1) setActive(next);
    requestAnimationFrame(() => inputRef.current && inputRef.current.focus());
  };
  const clearSlot = (i) => {
    setPicks(prev => { const c = [...prev]; c[i] = null; return c; });
    setActive(i);
    requestAnimationFrame(() => inputRef.current && inputRef.current.focus());
  };
  const onKey = (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (results[0]) selectSkater(results[0].id);
      else if (picks.every(Boolean)) onSubmit(picks);
    }
  };

  return (
    <div>
      {/* slots positions */}
      <div className="space-y-1.5">
        {picks.map((id, i) => {
          const sk = skaters.find(s => s.id === id);
          const isActive = i === active;
          return (
            <div key={i}
              onClick={() => { setActive(i); requestAnimationFrame(() => inputRef.current && inputRef.current.focus()); }}
              className={`flex items-center gap-2 px-2 py-2.5 border ${isActive ? 'border-red-500 bg-red-500/10' : sk ? 'border-zinc-700 bg-zinc-900' : 'border-zinc-800'}`}>
              <span className="w-9 text-center shrink-0">
                <span className="block text-[8px] text-zinc-500 leading-none">P°</span>
                <span className="text-xl font-bold leading-none">{i + 1}</span>
              </span>
              {sk ? (
                <span className="flex-1 min-w-0 flex items-baseline gap-2">
                  <span className="font-bold text-red-500 text-lg">{sk.bib}</span>
                  <span className="text-sm truncate">{sk.name}</span>
                </span>
              ) : (
                <span className="flex-1 text-sm text-zinc-600">{isActive ? '→ saisie en cours' : 'vide'}</span>
              )}
              <span className="text-red-500 font-bold shrink-0">+{pts[i]}</span>
              {sk && <button onClick={(e) => { e.stopPropagation(); clearSlot(i); }} className="text-zinc-500 active:text-red-500 px-1 shrink-0">✕</button>}
            </div>
          );
        })}
      </div>

      {/* champ de saisie */}
      <div className="flex gap-2 mt-2">
        <input ref={inputRef} value={query} inputMode={numeric ? 'numeric' : 'text'} autoFocus
          onChange={e => setQuery(e.target.value)} onKeyDown={onKey}
          placeholder={numeric ? `N° dossard → P${active + 1}` : `Nom → P${active + 1}`}
          className="flex-1 bg-zinc-900 border border-zinc-700 px-3 py-3 text-lg focus:border-red-500 outline-none" />
        <button onClick={() => setNumeric(n => !n)}
          className="w-14 border border-zinc-700 text-xs text-zinc-400 active:bg-zinc-800">{numeric ? 'ABC' : '123'}</button>
      </div>

      {/* suggestions (uniquement quand on tape) */}
      {query ? (
        <div className="mt-1 border border-zinc-800 max-h-56 overflow-y-auto">
          {results.length ? results.map(s => (
            <button key={s.id} onClick={() => selectSkater(s.id)}
              className="w-full flex items-center gap-2 px-2 py-2.5 active:bg-zinc-900 border-b border-zinc-900 text-left">
              {favorites.includes(s.id) && <span className="text-amber-400 text-xs">★</span>}
              <span className="font-bold text-red-500 w-9 text-base">{s.bib}</span>
              <span className="flex-1 truncate text-sm">{s.name}</span>
              <span className="text-[10px] truncate max-w-[80px]" style={{ color: clubColor(s.club) }}>{clubShort(s.club)}</span>
            </button>
          )) : <div className="px-2 py-3 text-zinc-600 text-xs">Aucun coureur pour « {query} »</div>}
        </div>
      ) : (
        <div className="mt-1 text-[10px] text-zinc-600">Tape le dossard puis ⏎ : remplit P{active + 1} et passe au suivant.</div>
      )}

      <button onClick={() => onSubmit(picks)} disabled={!picks.some(Boolean)}
        className="w-full mt-2 py-3.5 bg-red-600 active:bg-red-500 disabled:opacity-40 text-white text-lg font-bold uppercase tracking-wider">
        {existing ? 'Mettre à jour' : 'Valider'}{allFilled ? ' ✓' : ''}
      </button>
    </div>
  );
}

// VOICE BUTTON
// ============================================================
function VoiceButton({ onResult }) {
  const [listening, setListening] = useState(false);
  const [transcript, setTranscript] = useState('');
  const [error, setError] = useState(null);
  const recRef = useRef(null);
  const finalRef = useRef('');
  const supported = typeof window !== 'undefined' && ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window);

  const start = useCallback(() => {
    if (!supported) { setError('Vocal indispo'); setTimeout(()=>setError(null),2000); return; }
    setError(null); setTranscript(''); finalRef.current = '';
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = 'fr-FR'; rec.interimResults = true; rec.continuous = false;
    rec.onresult = (ev) => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) finalRef.current += t; else interim += t;
      }
      setTranscript((finalRef.current + interim).trim());
    };
    rec.onerror = (e) => { setError(e.error); setListening(false); setTimeout(()=>setError(null),2000); };
    rec.onend = () => { setListening(false); if (finalRef.current.trim()) onResult(finalRef.current.trim()); };
    try { rec.start(); setListening(true); recRef.current = rec; } catch { setError('start fail'); }
  }, [supported, onResult]);

  const stop = useCallback(() => { try { recRef.current && recRef.current.stop(); } catch {} }, []);

  return (
    <div className="relative">
      <button
        onMouseDown={start} onMouseUp={stop} onMouseLeave={()=>listening&&stop()}
        onTouchStart={(e)=>{e.preventDefault();start();}} onTouchEnd={(e)=>{e.preventDefault();stop();}}
        className={`w-14 h-full min-h-[48px] border flex items-center justify-center ${listening ? 'bg-red-600 border-red-600 animate-pulse' : 'bg-zinc-900 border-zinc-700'}`}>
        <svg viewBox="0 0 24 24" className="w-6 h-6" fill="currentColor">
          <path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3z"/>
          <path d="M19 11a1 1 0 10-2 0 5 5 0 01-10 0 1 1 0 10-2 0 7 7 0 006 6.92V21h-2a1 1 0 100 2h6a1 1 0 100-2h-2v-3.08A7 7 0 0019 11z"/>
        </svg>
      </button>
      {listening && (
        <div className="absolute bottom-full left-0 mb-1 bg-black border border-red-500 px-2 py-1 text-[10px] text-red-400 whitespace-nowrap z-30 max-w-[60vw] overflow-hidden">
          ● {transcript || 'Parle…'}
        </div>
      )}
      {error && <div className="absolute bottom-full left-0 mb-1 bg-black border border-amber-500 px-2 py-1 text-[10px] text-amber-400 z-30">⚠ {error}</div>}
    </div>
  );
}

      ) : (
        <div className="space-y-1">
          <div className="text-[9px] text-zinc-600 uppercase mb-1">Points cumulés par club</div>
          {teamRanking.map((t, i) => (
            <div key={t.club} className="border border-zinc-800 p-2" style={{ borderLeftWidth: 3, borderLeftColor: clubColor(t.club) }}>
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2 min-w-0">
                  <span className="text-zinc-500 font-bold w-5">{i+1}</span>
                  <span className="text-sm truncate" style={{color:clubColor(t.club)}}>{clubShort(t.club)}</span>
                  <span className="text-[10px] text-zinc-600">×{t.skaters.length}</span>
                </div>
                <span className="text-xl font-bold">{t.points}<span className="text-[8px] text-zinc-600 ml-1">PTS</span></span>
              </div>
              <div className="flex flex-wrap gap-1 mt-1">
                {t.skaters.sort((a,b)=>a.rank-b.rank).map(s => (
                  <span key={s.id} className="text-[10px] px-1 border border-zinc-800 text-zinc-400">#{s.bib} ({s.points})</span>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
      <div className="h-4" />
    </div>
  );
}

// ============================================================
// IMPORT MODAL
// ============================================================
function ImportModal({ onClose, onImport }) {
  const [tab, setTab] = useState('photo');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [preview, setPreview] = useState(null);
  const [text, setText] = useState('');

  const doPhoto = async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    setLoading(true); setError(null); setPreview(null);
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=()=>rej(new Error('lecture')); r.readAsDataURL(file); });
      const list = await importViaApi({ imageData: b64, mediaType: file.type });
      list.length ? setPreview(list) : setError('Aucun coureur détecté.');
    } catch (err) { setError(err.message); } finally { setLoading(false); }
  };
  const doText = async () => {
    if (!text.trim()) return;
    setLoading(true); setError(null); setPreview(null);
    try { const list = await importViaApi({ text }); list.length ? setPreview(list) : setError('Aucun coureur détecté.'); }
    catch (err) { setError(err.message); } finally { setLoading(false); }
  };

  return (
    <div className="fixed inset-0 bg-black/85 z-50 flex items-end sm:items-center justify-center">
      <div className="bg-zinc-950 border border-zinc-700 w-full sm:max-w-lg max-h-[90vh] overflow-y-auto safe-bottom">
        <div className="border-b border-zinc-800 px-4 py-3 flex justify-between items-center sticky top-0 bg-zinc-950">
          <h2 className="text-sm font-bold uppercase tracking-wider">Import starting list</h2>
          <button onClick={onClose} className="text-zinc-500 active:text-red-500 text-xl px-2">✕</button>
        </div>
        <div className="p-4">
          <div className="flex gap-1 mb-4">
            {[['photo','📷 Photo'],['paste','📋 Texte'],['manual','✎ Manuel']].map(([id,lbl]) => (
              <button key={id} onClick={()=>{setTab(id);setPreview(null);setError(null);}}
                className={`flex-1 py-2 text-xs uppercase border ${tab===id?'border-red-500 text-red-400':'border-zinc-800 text-zinc-500'}`}>{lbl}</button>
            ))}
          </div>

          {tab==='photo' && (
            <div>
              <p className="text-xs text-zinc-400 mb-3">Photo ou capture de la starting list. L'IA extrait dossard / nom / club / pays.</p>
              <input type="file" accept="image/*" capture="environment" onChange={doPhoto} disabled={loading}
                className="block w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-4 file:border-0 file:bg-red-600 file:text-white file:text-xs file:uppercase" />
            </div>
          )}
          {tab==='paste' && (
            <div>
              <p className="text-xs text-zinc-400 mb-3">Colle la liste (depuis un site, PDF, email…).</p>
              <textarea value={text} onChange={e=>setText(e.target.value)} rows={6}
                placeholder={"464 BEDDIAF Nolan MANAO\n449 ROCHER Matthis MANAO"}
                className="w-full bg-black border border-zinc-700 p-3 text-xs focus:border-red-500 outline-none" />
              <button onClick={doText} disabled={loading||!text.trim()}
                className="mt-2 w-full py-2 bg-red-600 active:bg-red-500 disabled:opacity-40 text-white text-xs uppercase tracking-wider">Analyser</button>
            </div>
          )}
          {tab==='manual' && <ManualEntry onSave={onImport} />}

          {loading && <div className="mt-3 text-xs text-amber-400">Analyse en cours…</div>}
          {error && <div className="mt-3 text-xs text-red-400 border border-red-900 bg-red-950/30 p-2">⚠ {error}</div>}

          {preview && (
            <div className="mt-4 border border-emerald-700 bg-emerald-950/20 p-3">
              <div className="text-xs text-emerald-400 uppercase mb-2">✓ {preview.length} coureurs détectés</div>
              <div className="max-h-52 overflow-y-auto space-y-px text-xs">
                {preview.map(p => (
                  <div key={p.id} className="flex items-center gap-2 py-1">
                    <span className="font-bold text-red-500 w-9">#{p.bib}</span>
                    <span className="flex-1 truncate">{p.name}</span>
                    <span className="text-zinc-500 truncate max-w-[90px]" style={{color:clubColor(p.club)}}>{clubShort(p.club)}</span>
                    <span>{flag(p.nat)}</span>
                  </div>
                ))}
              </div>
              <button onClick={()=>onImport(preview)}
                className="w-full mt-3 py-2 bg-red-600 active:bg-red-500 text-white text-xs uppercase tracking-wider">Importer cette liste</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ManualEntry({ onSave }) {
  const [rows, setRows] = useState([{ bib:'', name:'', club:'', nat:'FRA' }]);
  const upd = (i,f,v) => setRows(r => { const c=[...r]; c[i]={...c[i],[f]:v}; return c; });
  const save = () => {
    const list = rows.filter(r=>r.bib&&r.name).map((r,i)=>({ id:i+1, bib:Number(r.bib), name:r.name, club:r.club, nat:(r.nat||'FRA').toUpperCase(), cat:'Senior', status:null }));
    if (list.length) onSave(list);
  };
  return (
    <div>
      <div className="space-y-1 max-h-72 overflow-y-auto">
        {rows.map((r,i)=>(
          <div key={i} className="flex gap-1">
            <input value={r.bib} onChange={e=>upd(i,'bib',e.target.value)} placeholder="N°" inputMode="numeric" className="w-12 bg-black border border-zinc-700 px-2 py-1.5 text-xs" />
            <input value={r.name} onChange={e=>upd(i,'name',e.target.value)} placeholder="Nom" className="flex-1 bg-black border border-zinc-700 px-2 py-1.5 text-xs" />
            <input value={r.club} onChange={e=>upd(i,'club',e.target.value)} placeholder="Club" className="w-20 bg-black border border-zinc-700 px-2 py-1.5 text-xs" />
            <button onClick={()=>setRows(rows.filter((_,x)=>x!==i))} className="px-2 text-zinc-500">✕</button>
          </div>
        ))}
      </div>
      <div className="flex gap-2 mt-2">
        <button onClick={()=>setRows([...rows,{bib:'',name:'',club:'',nat:'FRA'}])} className="px-3 py-1.5 border border-zinc-700 text-zinc-400 text-xs">+ Ligne</button>
        <button onClick={save} className="flex-1 py-1.5 bg-red-600 active:bg-red-500 text-white text-xs uppercase tracking-wider">Sauver ({rows.filter(r=>r.bib&&r.name).length})</button>
      </div>
    </div>
  );
}

// ============================================================
// UI HELPERS
// ============================================================
function Block({ title, children }) {
  return <div><div className="text-[10px] tracking-[0.25em] text-zinc-500 uppercase mb-2">{title}</div><div className="space-y-2">{children}</div></div>;
}
function Lab({ children }) { return <label className="text-[10px] text-zinc-400 uppercase tracking-wider">{children}</label>; }
function Stat({ label, value }) {
  return <div className="flex justify-between items-baseline py-1 border-b border-zinc-900"><span className="text-[10px] text-zinc-500 uppercase">{label}</span><span className="text-sm font-bold">{value}</span></div>;
}
function Choice({ label, options, value, onChange }) {
  return (
    <div>
      <Lab>{label}</Lab>
      <div className="grid gap-1 mt-1" style={{ gridTemplateColumns: `repeat(${options.length},1fr)` }}>
        {options.map(o => (
          <button key={o} onClick={()=>onChange(o)}
            className={`py-2 text-xs border ${value===o?'bg-red-600 border-red-600 text-white':'border-zinc-700 text-zinc-400'}`}>{o}</button>
        ))}
      </div>
    </div>
  );
}
